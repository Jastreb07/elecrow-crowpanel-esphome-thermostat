  - id: update_clock_labels
    then:
      - lambda: |-
          auto now = id(ha_time).now();
          if (!now.is_valid()) return;
          static const char *const day_keys[] = {
              "clock.day.sun", "clock.day.mon", "clock.day.tue", "clock.day.wed",
              "clock.day.thu", "clock.day.fri", "clock.day.sat"};
          static const char *const mon_keys[] = {
              "clock.month.jan", "clock.month.feb", "clock.month.mar", "clock.month.apr",
              "clock.month.may", "clock.month.jun", "clock.month.jul", "clock.month.aug",
              "clock.month.sep", "clock.month.oct", "clock.month.nov", "clock.month.dec"};
          std::string day = id(i18n_translations).translate(day_keys[(now.day_of_week - 1) % 7]);
          std::string month = id(i18n_translations).translate(mon_keys[(now.month - 1) % 12]);
          char time_buf[12];
          if (id(time_24h).state) {
            snprintf(time_buf, sizeof(time_buf), "%02d:%02d", now.hour, now.minute);
          } else {
            int h12 = now.hour % 12; if (h12 == 0) h12 = 12;
            std::string ampm = id(i18n_translations).translate(now.hour < 12 ? "clock.am" : "clock.pm");
            snprintf(time_buf, sizeof(time_buf), "%d:%02d %s", h12, now.minute, ampm.c_str());
          }
          char date_buf[24];
          snprintf(date_buf, sizeof(date_buf), "%02d %s", now.day_of_month, month.c_str());
          id(pending_clock_time) = time_buf;
          id(pending_clock_day) = day;
          id(pending_home_date) = date_buf;
      - lvgl.label.update: {id: label_home_time, text: !lambda 'return id(pending_clock_time);'}
      - lvgl.label.update: {id: label_home_weekday, text: !lambda 'return id(pending_clock_day);'}
      - lvgl.label.update: {id: label_home_date, text: !lambda 'return id(pending_home_date);'}

  # Serializes every persisted setting (System/Thermostat/Timer/Progress/
  # Notify) into settings_export_txt as a compact "key=value;..." string -
  # not JSON, to avoid pulling in a JSON library for something this simple.
  # Keys are short and colors/language/unit are single letters, so ~29
  # settings still fit in Home Assistant's 255-char text-entity limit.
  # ha_config_entity and Timer/Progress/Notify content (end time, titles,
  # value) are intentionally excluded - the former rarely changes and has
  # its own entity already, the latter is live data, not a setting.
  - id: export_settings
    then:
      - lambda: |-
          std::string out;
          auto add_bool = [&out](const char *key, bool v) {
            out += key; out += "="; out += (v ? "1" : "0"); out += ";";
          };
          auto add_num = [&out](const char *key, float v) {
            char b[32];
            snprintf(b, sizeof(b), "%g", v);
            out += key; out += "="; out += b; out += ";";
          };
          auto add_chr = [&out](const char *key, char v) {
            out += key; out += "="; out += v; out += ";";
          };
          add_bool("t24", id(time_24h).state);
          add_bool("led", id(led_enabled).state);
          add_bool("tfb", id(timer_finish_blink_switch).state);
          add_bool("tvb", id(timer_value_blink_switch).state);
          add_bool("tss", id(timer_show_on_finish_switch).state);
          add_bool("wiz", id(setup_wizard_switch).state);
          add_chr("lang", id(language_select).current_option() == "Deutsch" ? 'd' : 'e');
          add_chr("unit", id(unit_select).current_option() == "Fahrenheit" ? 'F' : 'C');
          out += "kstep="; out += id(knob_step_select).current_option(); out += ";";
          add_chr("tcol", blink_led_color_letter(id(timer_blink_led_color_select).current_option()));
          add_num("idle", id(idle_home_num).state);
          add_num("dimd", id(dim_delay_num).state);
          add_num("diml", id(dim_level_num).state);
          add_num("bri", id(brightness_num).state);
          add_num("lbri", id(led_brightness_num).state);
          add_num("tah", id(timer_auto_home_num).state);
          add_num("pah", id(progress_auto_home_num).state);
          add_num("tks", id(timer_knob_step_num).state);
          add_num("tbb", id(timer_blink_led_brightness_num).state);
          add_num("pbb", id(progress_blink_led_brightness_num).state);
          add_num("nah", id(notify_auto_home_num).state);
          add_num("nbb", id(notify_blink_led_brightness_num).state);
          if (!out.empty()) out.pop_back();  // drop the trailing ';'
          id(settings_export_txt).make_call().set_value(out).perform();

  # Inverse of export_settings: reads settings_import_txt and applies every
  # recognized key. Unknown keys (e.g. from a different firmware version)
  # are silently skipped rather than failing the whole import.
  - id: import_settings
    then:
      - lambda: |-
          std::string data = id(settings_import_txt).state;
          size_t pos = 0;
          while (pos < data.size()) {
            size_t semi = data.find(';', pos);
            std::string pair = (semi == std::string::npos) ? data.substr(pos) : data.substr(pos, semi - pos);
            pos = (semi == std::string::npos) ? data.size() : semi + 1;
            size_t eq = pair.find('=');
            if (eq == std::string::npos) continue;
            std::string key = pair.substr(0, eq);
            std::string val = pair.substr(eq + 1);
            if (val.empty()) continue;
            bool bv = val == "1";
            float fv = strtof(val.c_str(), nullptr);
            char cv = val[0];
            if (key == "t24") { if (bv) id(time_24h).turn_on(); else id(time_24h).turn_off(); }
            else if (key == "led") { if (bv) id(led_enabled).turn_on(); else id(led_enabled).turn_off(); }
            else if (key == "tfb") { if (bv) id(timer_finish_blink_switch).turn_on(); else id(timer_finish_blink_switch).turn_off(); }
            else if (key == "tvb") { if (bv) id(timer_value_blink_switch).turn_on(); else id(timer_value_blink_switch).turn_off(); }
            else if (key == "tss") { if (bv) id(timer_show_on_finish_switch).turn_on(); else id(timer_show_on_finish_switch).turn_off(); }
            else if (key == "wiz") { if (bv) id(setup_wizard_switch).turn_on(); else id(setup_wizard_switch).turn_off(); }
            else if (key == "lang") { id(language_select).make_call().set_option(cv == 'd' ? "Deutsch" : "English").perform(); }
            else if (key == "unit") { id(unit_select).make_call().set_option(cv == 'F' ? "Fahrenheit" : "Celsius").perform(); }
            else if (key == "kstep") { id(knob_step_select).make_call().set_option(val).perform(); }
            else if (key == "tcol") { id(timer_blink_led_color_select).make_call().set_option(blink_led_color_from_letter(cv)).perform(); }
            else if (key == "idle") { id(idle_home_num).make_call().set_value(fv).perform(); }
            else if (key == "dimd") { id(dim_delay_num).make_call().set_value(fv).perform(); }
            else if (key == "diml") { id(dim_level_num).make_call().set_value(fv).perform(); }
            else if (key == "bri") { id(brightness_num).make_call().set_value(fv).perform(); }
            else if (key == "lbri") { id(led_brightness_num).make_call().set_value(fv).perform(); }
            else if (key == "tah") { id(timer_auto_home_num).make_call().set_value(fv).perform(); }
            else if (key == "pah") { id(progress_auto_home_num).make_call().set_value(fv).perform(); }
            else if (key == "tks") { id(timer_knob_step_num).make_call().set_value(fv).perform(); }
            else if (key == "tbb") { id(timer_blink_led_brightness_num).make_call().set_value(fv).perform(); }
            else if (key == "pbb") { id(progress_blink_led_brightness_num).make_call().set_value(fv).perform(); }
            else if (key == "nah") { id(notify_auto_home_num).make_call().set_value(fv).perform(); }
            else if (key == "nbb") { id(notify_blink_led_brightness_num).make_call().set_value(fv).perform(); }
          }

# ------------------------------------------------------------------
# Uhrzeit
# ------------------------------------------------------------------
time:
  - platform: homeassistant
    id: ha_time
    on_time_sync:
      - script.execute: update_clock_labels
    on_time:
      - minutes: "*"
        seconds: 0
        then:
          - script.execute: update_clock_labels
