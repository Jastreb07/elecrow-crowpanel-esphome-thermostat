# ------------------------------------------------------------------
# Encoder button. on_multi_click keeps single and double clicks separated.
# ------------------------------------------------------------------
binary_sensor:
  - platform: status
    name: "${friendly_name} Status"

  - platform: gpio
    id: encoder_button
    pin:
      pcf8574: pcf
      number: 5
      mode:
        input: true
      inverted: true
    filters:
      - delayed_on_off: 10ms
    on_press:
      - lambda: 'ESP_LOGI("diag", "encoder_button on_press, ui_context=%d", id(ui_context));'
      - if:
          condition:
            lambda: 'return id(connection_message) == "Smart Knob config not found";'
          then:
            - button.press: restart_btn
      - script.execute: wake_display
      - script.execute: global_hold_back
    on_release:
      # Releasing before 800 ms keeps the press as a normal click.
      - script.stop: global_hold_back
    on_multi_click:
      # Double click keeps the quick jump to the thermostat. A press while the
      # thermostat is already open also selects the other TRV/AC target.
      - timing:
          - ON for at most 350ms
          - OFF for 40ms to 350ms
          - ON for at most 350ms
          - OFF for at least 50ms
        then:
          - if:
              # The Setup Wizard must not have any quick-jump shortcut out of
              # it - a "double click" here is otherwise unhandled and used to
              # fall through to the ui_context != 1 branch below, which
              # opened the Thermostat screen. See activate_home_screen for
              # the other places this same rule is enforced. Treat it the
              # same as a single click instead of ignoring it outright,
              # since the tactile encoder button can register a deliberate
              # single press as this double-click pattern (switch bounce).
              condition:
                lambda: 'return id(ui_context) == 11;'
              then:
                - lambda: 'ESP_LOGI("diag", "encoder double-click, wizard_page=%d", id(wizard_page));'
                - if:
                    condition:
                      lambda: 'return id(wizard_page) >= 11;'
                    then:
                      - script.execute: wizard_finish
                    else:
                      - script.execute: wizard_next
              else:
                - if:
                    condition:
                      lambda: 'return id(ui_context) == 5;'
                    then:
                      - script.execute: toggle_active_light
                    else:
                      - if:
                          condition:
                            lambda: 'return id(ui_context) != 1;'
                          then:
                            - lambda: |-
                                id(climate_index) = 0;
                                id(ui_context) = 1;
                            - script.execute: load_active_climate
                            - lvgl.page.show: screen_thermostat
                          else:
                            - script.execute: toggle_adjust_target
      # Single click: enter/select inside settings. On the thermostat it now
      # switches directly between the TRV and AC/cool target.
      - timing:
          - ON for at most 350ms
          - OFF for at least 400ms
        then:
          - if:
              condition:
                lambda: 'return id(ui_context) == 11;'
              then:
                - lambda: 'ESP_LOGI("diag", "encoder single-click, wizard_page=%d", id(wizard_page));'
                - if:
                    condition:
                      lambda: 'return id(wizard_page) >= 11;'
                    then:
                      - script.execute: wizard_finish
                    else:
                      - script.execute: wizard_next
          - if:
              condition:
                lambda: 'return id(ui_context) == 0;'
              then:
                - lambda: |-
                    id(climate_index) = 0;
                    id(ui_context) = 1;
                - script.execute: load_active_climate
                - lvgl.page.show: screen_thermostat
              else:
                - if:
                    condition:
                      lambda: 'return id(ui_context) == 1;'
                    then:
                      - script.execute: toggle_adjust_target
                    else:
                      - if:
                          condition:
                            lambda: 'return id(ui_context) == 5;'
                          then:
                            - script.execute: toggle_active_light
                          else:
                            - if:
                                condition:
                                  lambda: 'return id(ui_context) == 7;'
                                then:
                                  - script.execute: cover_stop
                                else:
                                  - if:
                                      condition:
                                        lambda: 'return id(ui_context) == 8;'
                                      then:
                                        - script.execute: timer_click
                                      else:
                                        - if:
                                            condition:
                                              lambda: 'return id(ui_context) == 6;'
                                            then:
                                              - script.execute: entity_menu_enter
                                            else:
                                            - if:
                                                condition:
                                                  lambda: 'return id(ui_context) == 2;'
                                                then:
                                                  - if:
                                                      condition:
                                                        lambda: 'return id(menu_index) == SETTINGS_GROUP_COUNT;'
                                                      then:
                                                        - script.execute: close_settings
                                                      else:
                                                        - script.execute: group_enter
                                                else:
                                                  - if:
                                                      condition:
                                                        lambda: 'return id(ui_context) == 3;'
                                                      then:
                                                        - if:
                                                            condition:
                                                              lambda: |-
                                                                return id(group_item_index) == settings_group_count(id(menu_index));
                                                            then:
                                                              - lambda: 'id(ui_context) = 2;'
                                                              - script.execute: update_settings_labels
                                                            else:
                                                              - if:
                                                                  condition:
                                                                    lambda: |-
                                                                      return settings_group_entry_type_at(id(menu_index), id(group_item_index)) == 37;
                                                                  then:
                                                                    - script.execute: activate_wizard_screen
                                                                  else:
                                                                    - script.execute: menu_enter
                                                      else:
                                                        # Only the submenu editor may treat "none of the
                                                        # above" as apply. Without this guard, ui_context 11
                                                        # (Setup Wizard) also fell through the whole chain
                                                        # into submenu_apply, which yanked the UI into the
                                                        # settings screens right after every wizard click.
                                                        - if:
                                                            condition:
                                                              lambda: 'return id(ui_context) == 4;'
                                                            then:
                                                              - script.execute: submenu_apply
# ------------------------------------------------------------------
# Rotary encoder. Pins are swapped to fix rotation direction.
# ------------------------------------------------------------------
sensor:
  - platform: rotary_encoder
    id: temperature_encoder
    pin_a:
      number: GPIO4
      mode:
        input: true
        pullup: true
    pin_b:
      number: GPIO42
      mode:
        input: true
        pullup: true
    min_value: -100000
    max_value: 100000
    restore_mode: ALWAYS_ZERO
    on_value:
      then:
        - script.execute: wake_display
        - lambda: |-
            // Erstes Event nur als Referenz nehmen: der Encoder kann nach
            // einem Neustart einen alten Zaehlerstand liefern -> sonst
            // entsteht ein Riesen-Delta (Symptom: Sprung auf Max-Temp).
            static bool first_event = true;
            static int32_t last_raw = 0;
            int32_t raw = (int32_t) x;
            if (first_event) {
              first_event = false;
              id(encoder_delta) = 0;
            } else {
              id(encoder_delta) = raw - last_raw;
            }
            last_raw = raw;
        - if:
            condition:
              lambda: 'return id(encoder_delta) != 0 && id(ui_context) == 0;'
            then:
              - lambda: |-
                  id(ui_context) = 1;
                  id(climate_index) = 0;
                  id(encoder_delta) = 0;
              - script.execute: load_active_climate
              - lvgl.page.show: screen_thermostat
        - if:
            condition:
              lambda: 'return id(encoder_delta) != 0 && id(ui_context) == 1;'
            then:
              - lambda: |-
                  float step = strtof(id(knob_step_select).current_option().c_str(), nullptr);
                  if (step <= 0.0f) step = ${temperature_step};
                  float new_temp = id(target_temperature) + (step * id(encoder_delta));
                  if (new_temp < ${temperature_min}) new_temp = ${temperature_min};
                  if (new_temp > ${temperature_max}) new_temp = ${temperature_max};
                  // Dual setpoints must not cross; otherwise TRV and AC fight
                  // each other and better_thermostat may reject the range.
                  if (!std::isnan(id(target_low_v)) && !std::isnan(id(target_high_v))) {
                    if (id(adjust_target) == 0 && new_temp > id(target_high_v) - ${setpoint_min_gap})
                      new_temp = id(target_high_v) - ${setpoint_min_gap};
                    if (id(adjust_target) == 1 && new_temp < id(target_low_v) + ${setpoint_min_gap})
                      new_temp = id(target_low_v) + ${setpoint_min_gap};
                  }
                  id(target_temperature) = new_temp;
                  // Update the selected dual-setpoint cache immediately so
                  // its on-screen arc and knob follow every encoder detent.
                  if (!std::isnan(id(target_low_v)) && !std::isnan(id(target_high_v))) {
                    if (id(adjust_target) == 1) id(target_high_v) = new_temp;
                    else id(target_low_v) = new_temp;
                  }
                  auto &climate = id(ha_climates).get_mutable(id(climate_index));
                  climate.adjust_target = id(adjust_target);
                  climate.target_temperature = new_temp;
                  climate.target_low = id(target_low_v);
                  climate.target_high = id(target_high_v);
                  id(pending_climate_index) = id(climate_index);
                  id(pending_temperature_change) = true;
              - script.execute: refresh_temps
              - script.execute: send_temperature_update
        - if:
            condition:
              lambda: |-
                return id(encoder_delta) != 0 && id(ui_context) == 5 &&
                       id(ha_lights).get(id(light_index)).state == "on";
            then:
              - lambda: |-
                  if (id(ha_lights).ensure_mode(id(light_index)) ==
                      esphome::ha_light_controller::LIGHT_COLOR) {
                    auto &light = id(ha_lights).get_mutable(id(light_index));
                    int current = nearest_color_preset(light.hue);
                    int dir = id(encoder_delta) > 0 ? 1 : -1;
                    int next = ((current + dir) % LIGHT_COLOR_PRESET_COUNT +
                                LIGHT_COLOR_PRESET_COUNT) % LIGHT_COLOR_PRESET_COUNT;
                    light.hue = LIGHT_COLOR_PRESETS[next].hue;
                    light.saturation = LIGHT_COLOR_PRESETS[next].saturation;
                  } else {
                    id(ha_lights).adjust(id(light_index), id(encoder_delta));
                  }
                  id(pending_light_change) = true;
              - script.execute: refresh_light
              - script.execute: send_light_update
        - if:
            condition:
              lambda: 'return id(encoder_delta) != 0 && id(ui_context) == 7;'
            then:
              - lambda: |-
                  id(ha_covers).adjust(id(cover_index), id(encoder_delta));
                  id(pending_cover_change) = true;
                  id(pending_cover_index) = id(cover_index);
              - script.execute: refresh_cover
              - script.execute: send_cover_update
        - if:
            condition:
              lambda: |-
                return id(encoder_delta) != 0 && id(ui_context) == 8 &&
                       id(timer_queue_index) >= (int) parse_timer_queue(id(timer_queue)).size();
            then:
              # Only the empty "add a new timer" page (the last swipe page)
              # reacts to the knob - turning it adjusts a preview duration by
              # one knob-step per detent, from 0 the first turn or from the
              # current preview if already mid-edit (extend/shorten before
              # confirming). This is a plain duration, not an absolute
              # end-time, so it does not silently tick down while the user is
              # still deciding - the countdown itself only starts once
              # timer_click confirms it. Existing queued timers can no longer
              # be extended by turning the knob (remove + re-add instead).
              - lambda: |-
                  long base = id(timer_edit_seconds) > 0 ? id(timer_edit_seconds) : 0;
                  long step = (long) id(timer_knob_step_num).state;
                  int d = id(encoder_delta) > 0 ? 1 : -1;
                  // Snap to the next/previous multiple of the step size
                  // instead of just adding it - e.g. with a 10s step, turning
                  // up from 01:12:23 lands on 01:12:30, not 01:12:33.
                  long rem = step > 0 ? base % step : 0;
                  long new_remaining;
                  if (step <= 0) {
                    new_remaining = base + d;
                  } else if (d > 0) {
                    new_remaining = rem == 0 ? base + step : base + (step - rem);
                  } else {
                    new_remaining = rem == 0 ? base - step : base - rem;
                  }
                  if (new_remaining < 0) new_remaining = 0;
                  id(timer_edit_seconds) = (int) new_remaining;
              - script.execute: refresh_timer
        - if:
            condition:
              lambda: 'return id(encoder_delta) != 0 && id(ui_context) == 11 && id(wizard_page) == 1;'
            then:
              # Language page only - turning the knob toggles English/Deutsch
              # via the existing language_select entity, whose on_value
              # handler already sets the locale and refreshes every screen
              # (including this one, via refresh_wizard).
              - select.set:
                  id: language_select
                  option: !lambda |-
                    return id(language_select).current_option() == "Deutsch" ? "English" : "Deutsch";
        - if:
            condition:
              lambda: 'return id(encoder_delta) != 0 && id(ui_context) == 11 && id(wizard_page) >= 2;'
            then:
              # The ten HA-setup steps (pages 2-11) also move on knob turn, not
              # just on knob press - forward is still blocked by wizard_next on
              # an unsatisfied gate page (step 1/5), backward is always allowed.
              - if:
                  condition:
                    lambda: 'return id(encoder_delta) > 0;'
                  then:
                    - script.execute: wizard_next
                  else:
                    - script.execute: wizard_previous
        - if:
            condition:
              lambda: 'return id(encoder_delta) != 0 && id(ui_context) == 2;'
            then:
              - lambda: |-
                  id(menu_index) = menu_scroll_index(id(menu_index), id(encoder_delta), SETTINGS_ROOT_COUNT);
              - script.execute: update_settings_labels
        - if:
            condition:
              lambda: 'return id(encoder_delta) != 0 && id(ui_context) == 6;'
            then:
              - lambda: |-
                  int timer_count = !parse_timer_queue(id(timer_queue)).empty() ? 1 : 0;
                  int progress_count = !parse_progress_queue(id(progress_queue)).empty() ? 1 : 0;
                  int notify_count = id(notify_finished) ? 1 : 0;
                  int count = (int) id(ha_climates).size() + (int) id(ha_lights).size() +
                              (int) id(ha_covers).size() + timer_count + progress_count + notify_count + 2;
                  id(entity_menu_index) = menu_scroll_index(id(entity_menu_index), id(encoder_delta), count);
              - script.execute: update_settings_labels
        - if:
            condition:
              lambda: 'return id(encoder_delta) != 0 && id(ui_context) == 3;'
            then:
              - lambda: |-
                  int count = settings_group_entry_count(id(menu_index));
                  id(group_item_index) = menu_scroll_index(id(group_item_index), id(encoder_delta), count);
              - script.execute: update_settings_labels
        - if:
            condition:
              lambda: 'return id(encoder_delta) != 0 && id(ui_context) == 4;'
            then:
              - lambda: |-
                  int d = id(encoder_delta) > 0 ? 1 : -1;
                  switch (id(submenu_type)) {
                    case 0:
                    case 1:
                    case 13:
                    case 25:
                      id(submenu_index) = menu_scroll_index(id(submenu_index), id(encoder_delta), id(submenu_count));
                      break;
                    case 2:
                      id(brightness_pct) = clamp(id(brightness_pct) + d * 5, 5, 100);
                      break;
                    case 3: case 4: case 7:
                    case 16: case 17:
                    case 19:
                    case 23: case 26:
                      id(submenu_index) = 1 - id(submenu_index);
                      break;
                    case 8:
                    case 9:
                      id(num_preview) = clamp(id(num_preview) + d * 5, 5, 300);
                      break;
                    case 10:
                    case 18:
                    case 29:
                    case 30:
                    case 34:
                      id(num_preview) = clamp(id(num_preview) + d * 5, 0, 100);
                      break;
                    case 11:
                    case 20:
                    case 31:
                      // 0 = "never auto-home", unlike Idle Time/Dim After
                      // which always stay at least 5s.
                      id(num_preview) = clamp(id(num_preview) + d * 5, 0, 300);
                      break;
                    case 22:
                      id(num_preview) = clamp(id(num_preview) + d * 5, 5, 60);
                      break;
                    default:
                      break;
                  }
              - if:
                  condition:
                    lambda: 'return id(submenu_type) == 2;'
                  then:
                    - light.turn_on:
                        id: display_backlight
                        brightness: !lambda 'return id(brightness_pct) / 100.0f;'
              - if:
                  condition:
                    lambda: 'return id(submenu_type) == 18;'
                  then:
                    - script.execute: preview_led_brightness
              - script.execute: update_settings_labels

  - platform: wifi_signal
    id: wifi_rssi
    name: "${friendly_name} WiFi Signal"
    update_interval: 60s

# ------------------------------------------------------------------
# HVAC state, mode/preset lists, and active preset.
# ------------------------------------------------------------------
text_sensor:
  - platform: version
    id: fw_version
    name: "${friendly_name} Firmware"

  - platform: wifi_info
    ip_address:
      id: wifi_ip_txt
      name: "${friendly_name} IP"
    ssid:
      id: wifi_ssid_txt
      name: "${friendly_name} SSID"

# The Home Assistant config entity can be changed without recompiling. The
# template text component persists the selected entity ID in ESP flash and
# publishes it as a normal configurable Home Assistant entity.
text:
  - platform: template
    name: "Home Assistant Config Entity"
    id: ha_config_entity
    icon: "mdi:database-cog-outline"
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: ${ha_config_entity_id}
    min_length: 3
    max_length: 100
    pattern: "[a-z0-9_]+\\.[a-z0-9_]+"
    mode: text
    on_value:
      then:
        - lambda: |-
            id(ha_climates).set_config_entity_id(x);
            id(ha_lights).set_config_entity_id(x);
            id(ha_covers).set_config_entity_id(x);
            id(climate_index) = 0;
            id(light_index) = 0;
            id(cover_index) = 0;
        - script.execute: refresh_connection

  - platform: template
    name: "Settings Export"
    id: settings_export_txt
    icon: "mdi:export-variant"
    entity_category: config
    optimistic: true
    restore_value: false
    initial_value: ""
    max_length: 255
    mode: text

  - platform: template
    name: "Settings Import"
    id: settings_import_txt
    icon: "mdi:import"
    entity_category: config
    optimistic: true
    restore_value: false
    initial_value: ""
    max_length: 255
    mode: text

  # Timer: the queue itself is internal-only (id(timer_queue), not an HA
  # entity), same design as the Notify queue below. HA adds one timer at a
  # time here as "id=xxx;title=...;end=YYYY-MM-DD HH:MM:SS;color=RRGGBB;
  # led_mode=0..2;value_blink=0|1;arc_color=RRGGBB" (end is required,
  # arc_color is optional - empty keeps the default purple arc), then
  # presses "Add to Queue" to append it. Timers can also be created directly
  # on the device via the Timer screen's last swipe page - see timer_click.
  - platform: template
    name: "[Timer] Add Timer"
    id: timer_add_txt
    icon: "mdi:timer-plus-outline"
    optimistic: true
    restore_value: false
    initial_value: ""
    max_length: 255
    mode: text

  - platform: template
    name: "[Timer] Remove Timer ID"
    id: timer_remove_id_txt
    icon: "mdi:timer-minus-outline"
    optimistic: true
    restore_value: false
    initial_value: ""
    max_length: 64
    mode: text

  # Progress: same internal-only queue design. HA adds/updates one entry at
  # a time here as "id=xxx;title=...;value=0..100;color=RRGGBB;
  # led_mode=0..2;value_blink=0|1;arc_color=RRGGBB" (arc_color optional,
  # empty keeps the default purple arc) - sending the same id again
  # replaces that entry (upsert), which is how HA updates a running
  # percentage.
  - platform: template
    name: "[Progress] Add/Update Progress"
    id: progress_add_txt
    icon: "mdi:progress-check"
    optimistic: true
    restore_value: false
    initial_value: ""
    max_length: 255
    mode: text

  - platform: template
    name: "[Progress] Remove Progress ID"
    id: progress_remove_id_txt
    icon: "mdi:progress-close"
    optimistic: true
    restore_value: false
    initial_value: ""
    max_length: 64
    mode: text

  # Notify: the queue itself is internal-only (id(notify_queue), not an HA
  # entity - see globals above) so it never has to fit HA's 255-char text
  # limit. HA adds one notification at a time here as a human-readable
  # "id=xxx;title=Hello world;subtitle=...;color=RRGGBB;led_mode=0..2;
  # priority=0..2;value_blink=0|1;end=YYYY-MM-DD HH:MM:SS" string (id = any
  # unique string the caller picks, color = a 6-digit hex RGB, led_mode =
  # 0 off/1 on/2 blink, priority = 0 low/1 medium/2 high; `end` is optional -
  # if set, the entry shows a Timer-style countdown arc while it's the one
  # displayed, and deletes itself once that time passes; `arc_color` is also
  # optional, a 6-digit hex RGB for that countdown arc - empty keeps the
  # default purple), then presses "Add to Queue" to append it. See
  # parse_notify_entry() in thermostat_helpers.h.
  - platform: template
    name: "[Notify] Add Notification"
    id: notify_add_txt
    icon: "mdi:bell-plus-outline"
    optimistic: true
    restore_value: false
    initial_value: ""
    max_length: 255
    mode: text

  # The unique id of the queue entry to drop, then press "Remove from Queue".
  - platform: template
    name: "[Notify] Remove Notification ID"
    id: notify_remove_id_txt
    icon: "mdi:bell-minus-outline"
    optimistic: true
    restore_value: false
    initial_value: ""
    max_length: 64
    mode: text

# ------------------------------------------------------------------
# Scripts
# ------------------------------------------------------------------
script:
  # After API connect, force-copy Home Assistant states into globals. This
  # covers cases where individual on_value automations do not fire during init.
  - id: sync_ha_states
    mode: restart
    then:
      - delay: 2s
      - script.execute: load_active_climate
      - script.execute: refresh_connection

  # Copy the selected array entry into the existing UI cache. User changes
  # are kept in the component until Home Assistant confirms the new state.
  - id: load_active_climate
    mode: restart
    then:
      - lambda: |-
          if (id(ha_climates).empty()) {
            id(current_hvac_raw) = "unknown";
            id(last_hvac_mode).clear();
            id(current_action_raw).clear();
            id(hvac_modes_raw).clear();
            id(preset_modes_raw).clear();
            id(current_preset_raw).clear();
            id(pending_current_temperature) = NAN;
            id(pending_humidity) = NAN;
            id(target_low_v) = NAN;
            id(target_high_v) = NAN;
            id(pending_temperature_change) = false;
            return;
          }
          id(climate_index) = clamp(id(climate_index), 0, (int) id(ha_climates).size() - 1);
          auto &climate = id(ha_climates).get_mutable(id(climate_index));
          id(current_hvac_raw) = climate.state;
          id(last_hvac_mode) = climate.last_hvac_mode;
          id(current_action_raw) = climate.hvac_action;
          id(hvac_modes_raw) = climate.hvac_modes;
          id(preset_modes_raw) = climate.preset_modes;
          id(current_preset_raw) = climate.preset_mode;
          if (!std::isnan(climate.current_temperature))
            id(pending_current_temperature) = climate.current_temperature;
          id(pending_humidity) = climate.humidity;
          if (!id(pending_temperature_change) || id(pending_climate_index) != id(climate_index)) {
            id(adjust_target) = climate.adjust_target;
            id(target_low_v) = climate.target_low;
            id(target_high_v) = climate.target_high;
            if (!std::isnan(climate.target_low) && id(adjust_target) == 0)
              id(target_temperature) = climate.target_low;
            else if (!std::isnan(climate.target_high) && id(adjust_target) == 1)
              id(target_temperature) = climate.target_high;
            else if (!std::isnan(climate.target_temperature))
              id(target_temperature) = climate.target_temperature;
          }
      - lvgl.label.update:
          id: label_climate_name
          text: !lambda |-
            const std::string name = id(ha_climates).empty() ? std::string() :
                                     id(ha_climates).get(id(climate_index)).name;
            return ha_text_or_placeholder(id(connection_ready), name, 10);
      - lvgl.label.update:
          id: label_climate_page
          text: !lambda |-
            if (!id(connection_ready))
              return ha_text_or_placeholder(false, std::string(), 5);
            if (id(ha_climates).empty()) return std::string("0 / 0");
            char page[20];
            snprintf(page, sizeof(page), "%d / %d", id(climate_index) + 1,
                     (int) id(ha_climates).size());
            return std::string(page);
      - lambda: |-
          lv_label_set_long_mode(id(label_climate_name), LV_LABEL_LONG_MODE_SCROLL_CIRCULAR);
          lv_obj_update_layout(id(label_climate_name));
      - script.execute: refresh_temps
      - script.execute: refresh_status
      - script.execute: refresh_connection

  - id: send_temperature_update
    mode: restart
    then:
      - delay: ${debounce_ms}
      - script.execute: apply_temperature_update

  - id: apply_temperature_update
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(pending_temperature_change);'
          then:
            - if:
                condition:
                  lambda: |-
                    const auto &climate = id(ha_climates).get(id(pending_climate_index));
                    return !std::isnan(climate.target_low) && !std::isnan(climate.target_high);
                then:
                  # Dual setpoint: update only the active target and clamp it
                  # against the other target so the range never crosses.
                  - lambda: |-
                      auto &climate = id(ha_climates).get_mutable(id(pending_climate_index));
                      if (climate.adjust_target == 1) {
                        if (climate.target_high < climate.target_low + ${setpoint_min_gap})
                          climate.target_high = climate.target_low + ${setpoint_min_gap};
                      } else {
                        if (climate.target_low > climate.target_high - ${setpoint_min_gap})
                          climate.target_low = climate.target_high - ${setpoint_min_gap};
                      }
                  - homeassistant.service:
                      service: climate.set_temperature
                      data:
                        entity_id: !lambda 'return id(ha_climates).get(id(pending_climate_index)).entity_id;'
                        target_temp_low: !lambda |-
                          char buf[16];
                          snprintf(buf, sizeof(buf), "%.1f", id(ha_climates).get(id(pending_climate_index)).target_low);
                          return std::string(buf);
                        target_temp_high: !lambda |-
                          char buf[16];
                          snprintf(buf, sizeof(buf), "%.1f", id(ha_climates).get(id(pending_climate_index)).target_high);
                          return std::string(buf);
                else:
                  - homeassistant.service:
                      service: climate.set_temperature
                      data:
                        entity_id: !lambda 'return id(ha_climates).get(id(pending_climate_index)).entity_id;'
                        temperature: !lambda |-
                          char buf[16];
                          snprintf(buf, sizeof(buf), "%.1f", id(ha_climates).get(id(pending_climate_index)).target_temperature);
                          return std::string(buf);
            - lambda: 'id(pending_temperature_change) = false;'

  - id: wake_display
    then:
      # Reset LVGL idle timers. Encoder/button input is not an LVGL input
      # device, so dim and idle timers would otherwise ignore knob activity.
      - lambda: 'lv_disp_trig_activity(nullptr);'
      - if:
          condition:
            lambda: 'return id(display_dimmed);'
          then:
            - lambda: 'id(display_dimmed) = false;'
            - light.turn_on:
                id: display_backlight
                brightness: !lambda 'return id(brightness_pct) / 100.0f;'
            - script.execute: update_status_led

  # A short press on a light now toggles it directly. Mode changes are handled
  # exclusively by vertical swipe gestures.
  - id: toggle_active_light
    then:
      - if:
          condition:
            lambda: |-
              return id(ui_context) == 5 && id(light_index) >= 0 &&
                     id(light_index) < (int) id(ha_lights).size();
          then:
            - homeassistant.action:
                action: light.toggle
                data:
                  entity_id: !lambda 'return id(ha_lights).get(id(light_index)).entity_id;'

  # Holding the knob for 800 ms is the same Back action in every screen.
  - id: global_hold_back
    mode: restart
    then:
      - delay: 800ms
      - if:
          condition:
            lambda: 'return id(encoder_button).state;'
          then:
            - if:
                condition:
                  lambda: 'return id(thermostat_quick_stage) != 0;'
                then:
                  - lambda: |-
                      id(thermostat_quick_stage) = 0;
                      id(ui_context) = 1;
                  - script.execute: load_active_climate
                  - lvgl.page.show: screen_thermostat
                else:
                  - if:
                      condition:
                        lambda: 'return id(ui_context) == 4;'
                      then:
                        - lambda: 'id(ui_context) = 3;'
                        - script.execute: update_settings_labels
                      else:
                        - if:
                            condition:
                              lambda: 'return id(ui_context) == 3;'
                            then:
                              - lambda: 'id(ui_context) = 2;'
                              - script.execute: update_settings_labels
                            else:
                              - if:
                                  condition:
                                    lambda: 'return id(ui_context) == 2;'
                                  then:
                                    - script.execute: close_settings
                                  else:
                                    - if:
                                        condition:
                                          lambda: 'return id(ui_context) == 6;'
                                        then:
                                          - script.execute: close_entity_overview
                                        else:
                                          - if:
                                              condition:
                                                lambda: 'return id(ui_context) == 5;'
                                              then:
                                                - lambda: 'id(ui_context) = 1;'
                                                - script.execute: load_active_climate
                                                - lvgl.page.show: screen_thermostat
                                              else:
                                                - if:
                                                    condition:
                                                      lambda: |-
                                                        return id(ui_context) == 7 ||
                                                               id(ui_context) == 8 ||
                                                               id(ui_context) == 9 ||
                                                               id(ui_context) == 10;
                                                    then:
                                                      - lambda: 'id(ui_context) = 1;'
                                                      - script.execute: load_active_climate
                                                      - lvgl.page.show: screen_thermostat
                                                    else:
                                                      - if:
                                                          condition:
                                                            lambda: 'return id(ui_context) == 1;'
                                                          then:
                                                            - lambda: 'id(ui_context) = 0;'
                                                            - lvgl.page.show: screen_home

  # Target for the native LVGL swipe handlers on the settings page.
  - id: show_active_light_screen
    then:
      - if:
          condition:
            lambda: |-
              return id(ha_lights).ensure_mode(id(light_index)) ==
                     esphome::ha_light_controller::LIGHT_TEMPERATURE;
          then:
            - lvgl.page.show:
                id: screen_light_temperature
                animation: NONE
          else:
            - if:
                condition:
                  lambda: |-
                    return id(ha_lights).ensure_mode(id(light_index)) ==
                           esphome::ha_light_controller::LIGHT_COLOR;
                then:
                  - lvgl.page.show:
                      id: screen_light_color
                      animation: NONE
                else:
                  - lvgl.page.show:
                      id: screen_light_brightness
                      animation: NONE

  # Returns to whichever real screen open_settings/open_entity_overview
  # remembered (entity_return_kind/entity_return_index), i.e. the screen
  # that was actually open before entering screen_navigation.
  - id: close_settings
    then:
      - script.execute: wake_display
      - lambda: 'id(thermostat_quick_stage) = 0;'
      - script.execute: close_entity_overview

  # Move forward through configured thermostats. After the final thermostat,
  # continue with the first light or settings.
  - id: thermostat_next
    then:
      - script.execute: wake_display
      - if:
          condition:
            lambda: 'return id(pending_temperature_change);'
          then:
            - script.stop: send_temperature_update
            - script.execute: apply_temperature_update
      - if:
          condition:
            lambda: 'return id(climate_index) + 1 < (int) id(ha_climates).size();'
          then:
            - lambda: 'id(climate_index)++;'
            - script.execute: load_active_climate
          else:
            - script.execute: open_first_light_or_settings

  # Home is intentionally excluded from swipe navigation, so the first
  # thermostat has no previous page.
  - id: thermostat_previous
    then:
      - script.execute: wake_display
      - if:
          condition:
            lambda: 'return id(pending_temperature_change);'
          then:
            - script.stop: send_temperature_update
            - script.execute: apply_temperature_update
      - if:
          condition:
            lambda: 'return id(climate_index) > 0;'
          then:
            - lambda: 'id(climate_index)--;'
            - script.execute: load_active_climate

  # Final thermostat -> first configured light, or directly to settings when
  # the light list is empty.
  - id: open_first_light_or_settings
    then:
      - script.execute: wake_display
      - if:
          condition:
            lambda: 'return !id(ha_lights).empty();'
          then:
            - lambda: |-
                id(light_index) = 0;
                id(ui_context) = 5;
            - script.execute: refresh_light
            - script.execute: show_active_light_screen
          else:
            - script.execute: open_settings

  # Move forward through logical light pages; the final light leads to the
  # grouped settings page.
  - id: light_next
    then:
      - script.execute: wake_display
      - if:
          condition:
            lambda: 'return id(light_index) + 1 < (int) id(ha_lights).size();'
          then:
            - lambda: 'id(light_index)++;'
            - script.execute: refresh_light
            - script.execute: show_active_light_screen
          else:
            - script.execute: open_settings

  # Move backward through light pages; the first light leads to thermostat.
  - id: light_previous
    then:
      - script.execute: wake_display
      - if:
          condition:
            lambda: 'return id(light_index) > 0;'
          then:
            - lambda: 'id(light_index)--;'
            - script.execute: refresh_light
            - script.execute: show_active_light_screen
          else:
            - lambda: |-
                id(climate_index) = (int) id(ha_climates).size() - 1;
                id(ui_context) = 1;
            - script.execute: load_active_climate
            - lvgl.page.show:
                id: screen_thermostat

  # direction > 0 moves to the next light screen, direction < 0 to the
  # previous one; both wrap around (see swipe_step_vertical/horizontal).
  - id: cycle_light_mode
    parameters:
      direction: int
    then:
      - script.stop: send_light_update
      - lambda: 'id(pending_light_change) = false;'
      - lambda: 'id(ha_lights).cycle_mode(id(light_index), direction);'
      - script.execute: refresh_light
      - script.execute: show_active_light_screen

  # Shared overview on screen_navigation. It lists every configured climate and
  # light, followed by Settings and Back. Pressing an entity opens it directly.
  - id: open_entity_overview
    then:
      - script.execute: wake_display
      - lambda: |-
          if (id(ui_context) == 1) {
            id(entity_return_kind) = 1;
            id(entity_return_index) = id(climate_index);
            id(entity_menu_index) = id(climate_index);
          } else if (id(ui_context) == 5) {
            id(entity_return_kind) = 2;
            id(entity_return_index) = id(light_index);
            id(entity_menu_index) = (int) id(ha_climates).size() + id(light_index);
          } else if (id(ui_context) == 7) {
            id(entity_return_kind) = 3;
            id(entity_return_index) = id(cover_index);
            id(entity_menu_index) =
                (int) id(ha_climates).size() + (int) id(ha_lights).size() + id(cover_index);
          } else if (id(ui_context) == 9) {
            // Progress is first after Covers - see entity_menu_enter.
            id(entity_return_kind) = 5;
            id(entity_menu_index) =
                (int) id(ha_climates).size() + (int) id(ha_lights).size() + (int) id(ha_covers).size();
          } else if (id(ui_context) == 10) {
            id(entity_return_kind) = 6;
            int progress_count = !parse_progress_queue(id(progress_queue)).empty() ? 1 : 0;
            id(entity_menu_index) = (int) id(ha_climates).size() + (int) id(ha_lights).size() +
                                     (int) id(ha_covers).size() + progress_count;
          } else if (id(ui_context) == 8) {
            // Timer always sits right before Settings, after Progress/Notify.
            id(entity_return_kind) = 4;
            int progress_count = !parse_progress_queue(id(progress_queue)).empty() ? 1 : 0;
            int notify_count = id(notify_finished) ? 1 : 0;
            id(entity_menu_index) = (int) id(ha_climates).size() + (int) id(ha_lights).size() +
                                     (int) id(ha_covers).size() + progress_count + notify_count;
          }
          id(thermostat_quick_stage) = 0;
          id(ui_context) = 6;
      - script.execute: update_settings_labels
      - lvgl.page.show:
          id: screen_navigation
          animation: NONE

  - id: close_entity_overview
    then:
      - if:
          condition:
            lambda: 'return id(entity_return_kind) == 2 && !id(ha_lights).empty();'
          then:
            - lambda: |-
                id(light_index) = clamp(id(entity_return_index), 0, (int) id(ha_lights).size() - 1);
                id(ui_context) = 5;
            - script.execute: refresh_light
            - script.execute: show_active_light_screen
          else:
            - if:
                condition:
                  lambda: 'return id(entity_return_kind) == 3 && !id(ha_covers).empty();'
                then:
                  - lambda: |-
                      id(cover_index) = clamp(id(entity_return_index), 0, (int) id(ha_covers).size() - 1);
                      id(ui_context) = 7;
                  - script.execute: refresh_cover
                  - lvgl.page.show:
                      id: screen_cover
                      animation: NONE
                else:
                  - if:
                      condition:
                        lambda: 'return id(entity_return_kind) == 4;'
                      then:
                        - lambda: 'id(ui_context) = 8; id(timer_queue_index) = 0;'
                        - script.execute: refresh_timer
                        - lvgl.page.show:
                            id: screen_timer
                            animation: NONE
                      else:
                        - if:
                            condition:
                              lambda: 'return id(entity_return_kind) == 5;'
                            then:
                              - lambda: 'id(ui_context) = 9; id(progress_queue_index) = 0;'
                              - script.execute: refresh_progress
                              - lvgl.page.show:
                                  id: screen_progress
                                  animation: NONE
                            else:
                              - if:
                                  condition:
                                    lambda: 'return id(entity_return_kind) == 6;'
                                  then:
                                    - lambda: |-
                                        id(ui_context) = 10;
                                        id(notify_queue_index) = 0;
                                        if (id(notify_finished)) id(notify_finished_at_ms) = millis();
                                    - script.execute: refresh_notify
                                    - lvgl.page.show:
                                        id: screen_notify
                                        animation: NONE
                                  else:
                                    - lambda: |-
                                        id(climate_index) = clamp(id(entity_return_index), 0, (int) id(ha_climates).size() - 1);
                                        id(ui_context) = 1;
                                    - script.execute: load_active_climate
                                    - lvgl.page.show:
                                        id: screen_thermostat
                                        animation: NONE

  - id: settings_swipe_back
    then:
      - if:
          condition:
            lambda: 'return id(thermostat_quick_stage) != 0;'
          then:
            - lambda: |-
                id(thermostat_quick_stage) = 0;
                id(ui_context) = 1;
            - script.execute: load_active_climate
            - lvgl.page.show:
                id: screen_thermostat
                animation: NONE
          else:
            - if:
                condition:
                  lambda: 'return id(ui_context) == 6;'
                then:
                  - script.execute: close_entity_overview
                else:
                  - script.execute: close_settings

  - id: entity_menu_enter
    then:
      - lambda: |-
          int climates = (int) id(ha_climates).size();
          int lights = (int) id(ha_lights).size();
          int covers = (int) id(ha_covers).size();
          int timer_count = !parse_timer_queue(id(timer_queue)).empty() ? 1 : 0;
          int progress_count = !parse_progress_queue(id(progress_queue)).empty() ? 1 : 0;
          int notify_count = id(notify_finished) ? 1 : 0;
          int total = climates + lights + covers + timer_count + progress_count + notify_count + 2;
          id(entity_menu_index) = ((id(entity_menu_index) % total) + total) % total;
      - if:
          condition:
            lambda: 'return id(entity_menu_index) < (int) id(ha_climates).size();'
          then:
            - lambda: |-
                id(climate_index) = id(entity_menu_index);
                id(ui_context) = 1;
            - script.execute: load_active_climate
            - lvgl.page.show: screen_thermostat
          else:
            - if:
                condition:
                  lambda: |-
                    int i = id(entity_menu_index) - (int) id(ha_climates).size();
                    return i >= 0 && i < (int) id(ha_lights).size();
                then:
                  - lambda: |-
                      id(light_index) = id(entity_menu_index) - (int) id(ha_climates).size();
                      id(ui_context) = 5;
                  - script.execute: refresh_light
                  - script.execute: show_active_light_screen
                else:
                  - if:
                      condition:
                        lambda: |-
                          int i = id(entity_menu_index) -
                                  (int) id(ha_climates).size() - (int) id(ha_lights).size();
                          return i >= 0 && i < (int) id(ha_covers).size();
                      then:
                        - lambda: |-
                            id(cover_index) = id(entity_menu_index) -
                                (int) id(ha_climates).size() - (int) id(ha_lights).size();
                            id(ui_context) = 7;
                        - script.execute: refresh_cover
                        - lvgl.page.show: screen_cover
                      else:
                        # Order here is Progress, Notify, Timer, Settings, Back -
                        # Timer always sits immediately before Settings, so it
                        # stays reachable in the same spot regardless of whether
                        # Progress/Notify are currently present.
                        - if:
                            condition:
                              lambda: |-
                                bool progress_present = !parse_progress_queue(id(progress_queue)).empty();
                                return progress_present &&
                                       id(entity_menu_index) == (int) id(ha_climates).size() +
                                           (int) id(ha_lights).size() + (int) id(ha_covers).size();
                            then:
                              - lambda: 'id(ui_context) = 9; id(progress_queue_index) = 0;'
                              - script.execute: refresh_progress
                              - lvgl.page.show: screen_progress
                            else:
                              - if:
                                  condition:
                                    lambda: |-
                                      int progress_count = !parse_progress_queue(id(progress_queue)).empty() ? 1 : 0;
                                      return id(notify_finished) &&
                                             id(entity_menu_index) == (int) id(ha_climates).size() +
                                                 (int) id(ha_lights).size() +
                                                 (int) id(ha_covers).size() + progress_count;
                                  then:
                                    - lambda: |-
                                        id(ui_context) = 10;
                                        id(notify_queue_index) = 0;
                                        if (id(notify_finished)) id(notify_finished_at_ms) = millis();
                                    - script.execute: refresh_notify
                                    - lvgl.page.show: screen_notify
                                  else:
                                    - if:
                                        condition:
                                          lambda: |-
                                            int progress_count = !parse_progress_queue(id(progress_queue)).empty() ? 1 : 0;
                                            int notify_count = id(notify_finished) ? 1 : 0;
                                            bool timer_present = !parse_timer_queue(id(timer_queue)).empty();
                                            return timer_present &&
                                                   id(entity_menu_index) == (int) id(ha_climates).size() +
                                                       (int) id(ha_lights).size() + (int) id(ha_covers).size() +
                                                       progress_count + notify_count;
                                        then:
                                          - lambda: 'id(ui_context) = 8; id(timer_queue_index) = 0;'
                                          - script.execute: refresh_timer
                                          - lvgl.page.show: screen_timer
                                        else:
                                          - if:
                                              condition:
                                                lambda: |-
                                                  int timer_count = !parse_timer_queue(id(timer_queue)).empty() ? 1 : 0;
                                                  int progress_count = !parse_progress_queue(id(progress_queue)).empty() ? 1 : 0;
                                                  int notify_count = id(notify_finished) ? 1 : 0;
                                                  return id(entity_menu_index) == (int) id(ha_climates).size() +
                                                      (int) id(ha_lights).size() + (int) id(ha_covers).size() +
                                                      timer_count + progress_count + notify_count;
                                              then:
                                                - script.execute: open_settings
                                              else:
                                                - script.execute: close_entity_overview

  # First vertical thermostat swipe opens HVAC. The following vertical swipe
  # changes the same quick selector to presets without creating another page.
  - id: open_thermostat_quick
    then:
      - script.execute: wake_display
      - lambda: |-
          auto page_obj = [](esphome::lvgl::LvPageType *page) { return page->obj; };
          lv_obj_t *target = page_obj(screen_navigation);
          lv_obj_t *widgets[] = {
              id(label_settings_title), id(label_menu_icon_prev2), id(label_menu_icon_prev),
              id(label_menu_icon), id(label_menu_icon_next), id(label_menu_icon_next2),
              id(label_menu_prev2), id(label_menu_prev), id(label_menu_current),
              id(label_menu_next), id(label_menu_next2), id(label_menu_value)};
          for (lv_obj_t *widget : widgets)
            if (lv_obj_get_parent(widget) != target) lv_obj_set_parent(widget, target);
          id(thermostat_quick_stage) = 1;
          id(submenu_type) = 0;
          id(submenu_index) = 0;
          auto vec = ha_filter_modes(id(hvac_modes_raw));
          id(submenu_count) = (int) vec.size();
          for (size_t i = 0; i < vec.size(); i++)
            if (vec[i] == id(current_hvac_raw)) { id(submenu_index) = (int) i; break; }
          id(ui_context) = 4;
      - script.execute: update_settings_labels
      - lvgl.page.show:
          id: screen_navigation
          animation: NONE

  - id: cycle_thermostat_quick
    then:
      - if:
          condition:
            lambda: 'return id(thermostat_quick_stage) != 0;'
          then:
            - if:
                condition:
                  lambda: 'return id(thermostat_quick_stage) == 2;'
                then:
                  - lambda: |-
                      id(thermostat_quick_stage) = 0;
                      id(ui_context) = 1;
                  - script.execute: load_active_climate
                  - lvgl.page.show:
                      id: screen_thermostat
                      animation: NONE
                else:
                  - lambda: |-
                      id(thermostat_quick_stage) = 2;
                      id(submenu_type) = 1;
                      id(submenu_index) = 0;
                      auto vec = ha_filter_presets(id(preset_modes_raw));
                      id(submenu_count) = (int) vec.size();
                      for (size_t i = 0; i < vec.size(); i++)
                        if (vec[i] == id(current_preset_raw)) { id(submenu_index) = (int) i; break; }
                  - script.execute: update_settings_labels

  - id: send_light_update
    mode: restart
    then:
      # All light value modes use the same debounce. Because this script uses
      # mode: restart, every encoder detent restarts the delay.
      - delay: 500ms
      - if:
          condition:
            lambda: |-
              return id(pending_light_change) && id(ui_context) == 5 &&
                     id(ha_lights).get(id(light_index)).state == "on";
          then:
            - if:
                condition:
                  lambda: |-
                    return id(ha_lights).ensure_mode(id(light_index)) ==
                           esphome::ha_light_controller::LIGHT_BRIGHTNESS;
                then:
                  - homeassistant.action:
                      action: light.turn_on
                      data:
                        entity_id: !lambda 'return id(ha_lights).get(id(light_index)).entity_id;'
                        brightness_pct: !lambda |-
                          return to_string((int) roundf(id(ha_lights).get(id(light_index)).brightness));
                else:
                  - if:
                      condition:
                        lambda: |-
                          return id(ha_lights).ensure_mode(id(light_index)) ==
                                 esphome::ha_light_controller::LIGHT_TEMPERATURE;
                      then:
                        - homeassistant.action:
                            action: light.turn_on
                            data:
                              entity_id: !lambda 'return id(ha_lights).get(id(light_index)).entity_id;'
                              color_temp_kelvin: !lambda |-
                                return to_string((int) roundf(id(ha_lights).get(id(light_index)).color_temp_kelvin));
                      else:
                        - homeassistant.action:
                            action: light.turn_on
                            data:
                              entity_id: !lambda 'return id(ha_lights).get(id(light_index)).entity_id;'
                            data_template:
                              hs_color: "{{ [hue, saturation] }}"
                            variables:
                              hue: !lambda 'return id(ha_lights).get(id(light_index)).hue;'
                              # The color knob always represents the full
                              # color, independent of the previous Kelvin mode.
                              saturation: !lambda 'return 100.0f;'
            - lambda: 'id(pending_light_change) = false;'

  - id: refresh_light
    then:
      - lvgl.label.update:
          id: label_light_name
          text: !lambda |-
            return ha_text_or_placeholder(id(connection_ready),
                                          id(ha_lights).get(id(light_index)).name, 10);
      - lambda: |-
          // The name can be updated while the shared light page is hidden.
          // Restart LVGL's circular mode after every update so it recalculates
          // the rendered text width. LVGL only starts the animation when that
          // width is larger than the board-specific label width.
          lv_label_set_long_mode(id(label_light_name), LV_LABEL_LONG_MODE_SCROLL_CIRCULAR);
          lv_obj_update_layout(id(label_light_name));
      - lvgl.label.update:
          id: label_light_mode
          text: !lambda |-
            int mode = id(ha_lights).ensure_mode(id(light_index));
            std::string key = "light.mode_brightness";
            if (mode == esphome::ha_light_controller::LIGHT_TEMPERATURE) key = "light.mode_kelvin";
            else if (mode == esphome::ha_light_controller::LIGHT_COLOR) key = "light.mode_color";
            return ha_text_or_placeholder(id(connection_ready), id(i18n_translations).translate(key), 8);
      - lvgl.label.update:
          id: label_light_value
          text: !lambda |-
            if (!id(connection_ready))
              return ha_text_or_placeholder(false, std::string(), 3);
            const auto &light = id(ha_lights).get(id(light_index));
            if (light.state != "on") return id(i18n_translations).translate("light.value_off");
            int mode = id(ha_lights).ensure_mode(id(light_index));
            char value[20];
            if (mode == esphome::ha_light_controller::LIGHT_TEMPERATURE)
              snprintf(value, sizeof(value), "%.0fK", light.color_temp_kelvin);
            else if (mode == esphome::ha_light_controller::LIGHT_COLOR)
              snprintf(value, sizeof(value), "%.0f°", light.hue);
            else
              snprintf(value, sizeof(value), "%.0f%%", light.brightness);
            return std::string(value);
      # Each light page has its own static icon glyph (see thermostat_240/480
      # .yaml); only its on/off tint needs a runtime update.
      - lambda: |-
          int mode = id(ha_lights).ensure_mode(id(light_index));
          lv_obj_t *mode_icons[3] = {id(label_light_icon_brightness),
                                      id(label_light_icon_temperature),
                                      id(label_light_icon_color)};
          lv_color_t icon_color = id(ha_lights).get(id(light_index)).state == "on"
                                       ? lv_color_hex(0xE8E8E8)
                                       : lv_color_hex(0x555555);
          lv_obj_set_style_text_color(mode_icons[mode], icon_color, LV_PART_MAIN);
      - lvgl.label.update:
          id: label_light_state
          text: !lambda |-
            if (!id(connection_ready))
              return ha_text_or_placeholder(false, std::string(), 4);
            const auto &state = id(ha_lights).get(id(light_index)).state;
            if (state == "on") return id(i18n_translations).translate("light.state_on");
            if (state == "off") return id(i18n_translations).translate("light.state_off");
            if (state == "unavailable") return id(i18n_translations).translate("light.state_unavailable");
            return id(i18n_translations).translate("light.state_loading");
      - lvgl.label.update:
          id: label_light_page
          text: !lambda |-
            if (!id(connection_ready))
              return ha_text_or_placeholder(false, std::string(), 5);
            char page[20];
            snprintf(page, sizeof(page), "%d / %d", id(light_index) + 1, (int) id(ha_lights).size());
            return std::string(page);
      - lambda: |-
          // Brightness uses a tick scale, Kelvin a warm/cold pill and color a
          // handful of fixed presets (see LIGHT_COLOR_PRESETS).
          int mode = id(ha_lights).ensure_mode(id(light_index));
          auto page_obj = [](esphome::lvgl::LvPageType *page) { return page->obj; };
          lv_obj_t *target_page = mode == esphome::ha_light_controller::LIGHT_TEMPERATURE
              ? page_obj(screen_light_temperature)
              : mode == esphome::ha_light_controller::LIGHT_COLOR
                    ? page_obj(screen_light_color)
                    : page_obj(screen_light_brightness);
          lv_obj_t *shared_widgets[] = {
              id(light_brightness_scale), id(label_light_brightness_ticks),
              id(light_kelvin_scale), id(light_slider_knob), id(label_light_name),
              id(label_light_mode), id(label_light_value),
              id(label_light_state), id(label_light_page), id(light_mode_dot_0),
              id(light_mode_dot_1), id(light_mode_dot_2)};
          for (lv_obj_t *widget : shared_widgets)
            if (lv_obj_get_parent(widget) != target_page) lv_obj_set_parent(widget, target_page);

          const auto &light = id(ha_lights).get(id(light_index));
          bool on = id(connection_ready) && light.state == "on";
          bool brightness = mode == esphome::ha_light_controller::LIGHT_BRIGHTNESS;
          bool temperature = mode == esphome::ha_light_controller::LIGHT_TEMPERATURE;
          bool color = mode == esphome::ha_light_controller::LIGHT_COLOR;

          auto visible = [](lv_obj_t *obj, bool show) {
            if (show) lv_obj_remove_flag(obj, LV_OBJ_FLAG_HIDDEN);
            else lv_obj_add_flag(obj, LV_OBJ_FLAG_HIDDEN);
          };

          visible(id(light_brightness_scale), brightness);
          visible(id(label_light_brightness_ticks), brightness);
          visible(id(light_kelvin_scale), temperature);
          visible(id(light_slider_knob), on && (brightness || temperature));
          // On the color page the swatch itself shows the color, but there is
          // nothing to show when the light is off, so label_light_value ("OFF")
          // takes its place instead.
          visible(id(label_light_value), !color || !on);
          visible(id(label_light_page), !color);
          // label_light_name and label_light_mode ("Farbe") stay visible on
          // the color page too, same as on brightness/temperature.

          float normalized = on
              ? clamp(id(ha_lights).normalized_value(id(light_index)) / 100.0f, 0.0f, 1.0f)
              : 0.0f;
          int slider_x = (int) roundf((normalized - 0.5f) * ${light_slider_range});
          // Y comes from the widget's static layout (y: 70 on the 240, y: 145
          // on the 480) and is read back here unchanged; this only moves X.
          lv_obj_align(id(light_slider_knob), LV_ALIGN_CENTER, slider_x,
                       lv_obj_get_y_aligned(id(light_slider_knob)));

          char minimum[20], maximum[20];
          snprintf(minimum, sizeof(minimum), "%.0f K", light.min_color_temp_kelvin);
          snprintf(maximum, sizeof(maximum), "%.0f K", light.max_color_temp_kelvin);

          lv_obj_t *dots[] = {id(light_mode_dot_0), id(light_mode_dot_1), id(light_mode_dot_2)};
          for (int i = 0; i < 3; i++) {
            bool supported = i == 0 ? id(ha_lights).supports_brightness(id(light_index))
                            : i == 1 ? id(ha_lights).supports_temperature(id(light_index))
                                     : id(ha_lights).supports_color(id(light_index));
            lv_obj_set_style_bg_color(dots[i],
                lv_color_hex(i == mode ? 0xFFFFFF : supported ? 0x292B2E : 0x111214),
                LV_PART_MAIN);
          }

          // Big center preview shows the light's actual current color; hidden
          // while off since label_light_value ("OFF") takes its place then.
          // The preset row below highlights whichever preset is closest to it.
          visible(id(light_color_swatch), on);
          if (on)
            lv_obj_set_style_bg_color(
                id(light_color_swatch),
                lv_color_hsv_to_rgb((uint16_t) roundf(light.hue),
                                     (uint8_t) roundf(light.saturation), 100),
                LV_PART_MAIN);

          lv_obj_t *presets[LIGHT_COLOR_PRESET_COUNT] = {
              id(light_color_preset_0), id(light_color_preset_1), id(light_color_preset_2),
              id(light_color_preset_3), id(light_color_preset_4), id(light_color_preset_5),
              id(light_color_preset_6), id(light_color_preset_7), id(light_color_preset_8),
              id(light_color_preset_9), id(light_color_preset_10), id(light_color_preset_11),
              id(light_color_preset_12), id(light_color_preset_13), id(light_color_preset_14),
              id(light_color_preset_15), id(light_color_preset_16), id(light_color_preset_17)};
          // Preset colors are precomputed constants (LIGHT_COLOR_PRESETS[i].rgb),
          // so this loop only ever does a color lookup, never an HSV conversion.
          int selected_preset = nearest_color_preset(light.hue);
          for (int i = 0; i < LIGHT_COLOR_PRESET_COUNT; i++) {
            lv_obj_set_style_bg_color(presets[i], lv_color_hex(LIGHT_COLOR_PRESETS[i].rgb),
                                       LV_PART_MAIN);
            bool selected = on && color && i == selected_preset;
            lv_obj_set_style_border_width(presets[i], selected ? ${light_color_preset_border} : 0,
                                           LV_PART_MAIN);
            lv_obj_set_style_border_color(presets[i], lv_color_hex(0xFFFFFF), LV_PART_MAIN);
          }

          // Shared widgets are reparented last, so restore the intended
          // foreground order for the color page's own static widgets.
          lv_obj_move_foreground(id(label_light_icon_color));
          lv_obj_move_foreground(id(light_color_swatch));
          for (lv_obj_t *preset : presets) lv_obj_move_foreground(preset);
          lv_obj_move_foreground(id(label_light_name));
          lv_obj_move_foreground(id(label_light_page));
          lv_obj_move_foreground(id(light_mode_dot_0));
          lv_obj_move_foreground(id(light_mode_dot_1));
          lv_obj_move_foreground(id(light_mode_dot_2));

  # Same debounce pattern as send_light_update; uses pending_cover_index
  # (frozen at the last encoder tick) instead of the live cover_index in
  # case the user already swiped to a different cover before this fires.
  - id: send_cover_update
    mode: restart
    then:
      - delay: 500ms
      - if:
          condition:
            lambda: 'return id(pending_cover_change);'
          then:
            - if:
                condition:
                  lambda: 'return id(ha_covers).supports_position(id(pending_cover_index));'
                then:
                  - homeassistant.action:
                      action: cover.set_cover_position
                      data:
                        entity_id: !lambda 'return id(ha_covers).get(id(pending_cover_index)).entity_id;'
                        position: !lambda |-
                          return to_string(
                              (int) roundf(id(ha_covers).get(id(pending_cover_index)).position));
                else:
                  # No SET_POSITION support: the locally tracked position is
                  # only used to decide which direction the last nudge meant.
                  - if:
                      condition:
                        lambda: 'return id(ha_covers).get(id(pending_cover_index)).position >= 50.0f;'
                      then:
                        - homeassistant.action:
                            action: cover.open_cover
                            data:
                              entity_id: !lambda 'return id(ha_covers).get(id(pending_cover_index)).entity_id;'
                      else:
                        - homeassistant.action:
                            action: cover.close_cover
                            data:
                              entity_id: !lambda 'return id(ha_covers).get(id(pending_cover_index)).entity_id;'
            - lambda: 'id(pending_cover_change) = false;'

  - id: refresh_cover
    then:
      - lvgl.label.update:
          id: label_cover_name
          text: !lambda |-
            return ha_text_or_placeholder(id(connection_ready),
                                          id(ha_covers).get(id(cover_index)).name, 10);
      - lambda: |-
          lv_label_set_long_mode(id(label_cover_name), LV_LABEL_LONG_MODE_SCROLL_CIRCULAR);
          lv_obj_update_layout(id(label_cover_name));
      - lvgl.label.update:
          id: label_cover_mode
          text: !lambda |-
            if (!id(connection_ready)) return ha_text_or_placeholder(false, std::string(), 8);
            const std::string &state = id(ha_covers).get(id(cover_index)).state;
            if (state == "opening") return id(i18n_translations).translate("cover.opening");
            if (state == "closing") return id(i18n_translations).translate("cover.closing");
            if (state == "open") return id(i18n_translations).translate("cover.open");
            if (state == "closed") return id(i18n_translations).translate("cover.closed");
            return id(i18n_translations).translate("cover.label_default");
      - lvgl.label.update:
          id: label_cover_value
          text: !lambda |-
            if (!id(connection_ready)) return ha_text_or_placeholder(false, std::string(), 3);
            char value[8];
            snprintf(value, sizeof(value), "%.0f%%", id(ha_covers).get(id(cover_index)).position);
            return std::string(value);
      # The cover screen has one static icon glyph (see thermostat_240/480
      # .yaml); only its availability tint needs a runtime update.
      - lambda: |-
          bool available = id(connection_ready) &&
                            id(ha_covers).get(id(cover_index)).state != "unavailable";
          lv_obj_set_style_text_color(id(label_cover_icon),
              available ? lv_color_hex(0xFFFFFF) : lv_color_hex(0x4A3A73), LV_PART_MAIN);
      - lvgl.label.update:
          id: label_cover_page
          text: !lambda |-
            if (!id(connection_ready)) return ha_text_or_placeholder(false, std::string(), 5);
            char page[20];
            snprintf(page, sizeof(page), "%d / %d", id(cover_index) + 1, (int) id(ha_covers).size());
            return std::string(page);
      - lambda: |-
          // The whole screen is the slider: cover_fill grows down from the
          // top edge, and cover_fill_knob rides inside it, staying a fixed
          // gap above its bottom edge. At 0 % there is no fill to sit in,
          // so the knob hides along with it.
          float normalized = id(connection_ready)
              ? clamp(id(ha_covers).normalized_value(id(cover_index)) / 100.0f, 0.0f, 1.0f)
              : 0.0f;
          int fill_height = (int) roundf(normalized * ${cover_fill_max});
          lv_obj_set_height(id(cover_fill), fill_height);
          if (fill_height <= 0) {
            lv_obj_add_flag(id(cover_fill_knob), LV_OBJ_FLAG_HIDDEN);
          } else {
            lv_obj_clear_flag(id(cover_fill_knob), LV_OBJ_FLAG_HIDDEN);
            int knob_y = std::max(0, fill_height - ${cover_knob_margin});
            lv_obj_align(id(cover_fill_knob), LV_ALIGN_TOP_MID, 0, knob_y);
          }

  # Knob press on the cover screen: stop is the one action rotating the
  # encoder can't already achieve (rotating reaches 0/100 exactly).
  - id: cover_stop
    then:
      - if:
          condition:
            lambda: |-
              return id(ui_context) == 7 && id(cover_index) >= 0 &&
                     id(cover_index) < (int) id(ha_covers).size();
          then:
            - homeassistant.action:
                action: cover.stop_cover
                data:
                  entity_id: !lambda 'return id(ha_covers).get(id(cover_index)).entity_id;'

  # Swipe shortcuts for fully open/closed; optimistic position update so the
  # pill/knob react immediately instead of waiting for the next HA push.
  - id: cover_open_full
    then:
      - script.execute: wake_display
      - lambda: |-
          id(ha_covers).get_mutable(id(cover_index)).position = 100.0f;
      - script.execute: refresh_cover
      - homeassistant.action:
          action: cover.open_cover
          data:
            entity_id: !lambda 'return id(ha_covers).get(id(cover_index)).entity_id;'

  - id: cover_close_full
    then:
      - script.execute: wake_display
      - lambda: |-
          id(ha_covers).get_mutable(id(cover_index)).position = 0.0f;
      - script.execute: refresh_cover
      - homeassistant.action:
          action: cover.close_cover
          data:
            entity_id: !lambda 'return id(ha_covers).get(id(cover_index)).entity_id;'

  # Timer/Progress: queues of entries, browsed with swipe like Notify. The
  # Timer screen has one extra "page" past the real entries (index == total)
  # - an empty add page for creating a new timer directly on the device
  # (see timer_click / the ui_context == 8 encoder branch).
  - id: refresh_timer
    then:
      - lambda: |-
          auto items = parse_timer_queue(id(timer_queue));
          int total = (int) items.size();
          int idx = clamp(id(timer_queue_index), 0, total);
          bool on_add_page = (idx == total);
          auto now = id(ha_time).now();
          char value[16];
          // The cancel-confirm dialog (timer_click/check_finish_effects) hides
          // this label while pending - always unhide it here so every normal
          // refresh (adding/removing/swiping entries) restores it regardless
          // of how it last got hidden, instead of relying on every dialog
          // dismiss path to symmetrically restore it itself.
          lv_obj_clear_flag(id(label_timer_value), LV_OBJ_FLAG_HIDDEN);
          if (on_add_page) {
            long remaining = id(timer_edit_seconds) > 0 ? id(timer_edit_seconds) : 0;
            snprintf(value, sizeof(value), "%ld:%02ld:%02ld", remaining / 3600,
                     (remaining % 3600) / 60, remaining % 60);
            lv_label_set_text(id(label_timer_value), id(timer_edit_seconds) < 0 ? "--:--:--" : value);
            lv_label_set_text(id(label_timer_title), id(i18n_translations).translate("timer.add_hint").c_str());
            lv_obj_clear_flag(id(label_timer_title), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(label_timer_remove_hint), LV_OBJ_FLAG_HIDDEN);
            lv_arc_set_value(id(arc_timer_value), 0);
            lv_obj_add_flag(id(arc_timer_track), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(arc_timer_value), LV_OBJ_FLAG_HIDDEN);
          } else {
            auto &qt = items[idx];
            long remaining = timer_remaining_seconds(qt.end_time, now);
            bool finished = remaining <= 0;
            if (remaining < 0) remaining = 0;
            snprintf(value, sizeof(value), "%ld:%02ld:%02ld", remaining / 3600,
                     (remaining % 3600) / 60, remaining % 60);
            lv_label_set_text(id(label_timer_value), value);
            if (!qt.title.empty()) {
              lv_label_set_text(id(label_timer_title), qt.title.c_str());
              lv_obj_clear_flag(id(label_timer_title), LV_OBJ_FLAG_HIDDEN);
            } else {
              lv_obj_add_flag(id(label_timer_title), LV_OBJ_FLAG_HIDDEN);
            }
            // Finished entries show a hint below the title instead of the
            // usual two-click cancel-confirm dialog - a single press removes
            // them right away (see timer_click), since there is nothing left
            // to accidentally cancel.
            if (finished) {
              lv_label_set_text(id(label_timer_remove_hint),
                                 id(i18n_translations).translate("timer.remove_hint").c_str());
              lv_obj_clear_flag(id(label_timer_remove_hint), LV_OBJ_FLAG_HIDDEN);
            } else {
              lv_obj_add_flag(id(label_timer_remove_hint), LV_OBJ_FLAG_HIDDEN);
            }
            uint32_t elapsed = (now.is_valid() && now.timestamp > qt.added_epoch)
                                    ? now.timestamp - qt.added_epoch : 0;
            uint32_t total_secs = elapsed + (uint32_t) remaining;
            int percent = total_secs > 0
                              ? (int) clamp((float) elapsed / (float) total_secs * 100.0f, 0.0f, 100.0f)
                              : 0;
            lv_arc_set_value(id(arc_timer_value), percent);
            lv_obj_clear_flag(id(arc_timer_track), LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_flag(id(arc_timer_value), LV_OBJ_FLAG_HIDDEN);
            lv_obj_set_style_arc_color(id(arc_timer_value), lv_color_hex(arc_color_or_default(qt.arc_color)),
                                        LV_PART_INDICATOR);
          }
          int page_total = total + 1;
          if (page_total > 1) {
            char page[20];
            snprintf(page, sizeof(page), "%d / %d", idx + 1, page_total);
            lv_label_set_text(id(label_timer_page), page);
            lv_obj_clear_flag(id(label_timer_page), LV_OBJ_FLAG_HIDDEN);
            if (idx > 0) lv_obj_clear_flag(id(label_timer_arrow_prev), LV_OBJ_FLAG_HIDDEN);
            else lv_obj_add_flag(id(label_timer_arrow_prev), LV_OBJ_FLAG_HIDDEN);
            if (idx < page_total - 1) lv_obj_clear_flag(id(label_timer_arrow_next), LV_OBJ_FLAG_HIDDEN);
            else lv_obj_add_flag(id(label_timer_arrow_next), LV_OBJ_FLAG_HIDDEN);
          } else {
            lv_obj_add_flag(id(label_timer_page), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(label_timer_arrow_prev), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(label_timer_arrow_next), LV_OBJ_FLAG_HIDDEN);
          }
      - if:
          condition:
            lambda: 'return id(ui_context) == 6;'
          then:
            - script.execute: update_settings_labels

  - id: refresh_progress
    then:
      - lambda: |-
          auto items = parse_progress_queue(id(progress_queue));
          int total = (int) items.size();
          if (total > 0) {
            int idx = clamp(id(progress_queue_index), 0, total - 1);
            auto &qp = items[idx];
            char value[8];
            snprintf(value, sizeof(value), "%.0f%%", qp.value);
            lv_label_set_text(id(label_progress_value), value);
            if (!qp.title.empty()) {
              lv_label_set_text(id(label_progress_title), qp.title.c_str());
              lv_obj_clear_flag(id(label_progress_title), LV_OBJ_FLAG_HIDDEN);
            } else {
              lv_obj_add_flag(id(label_progress_title), LV_OBJ_FLAG_HIDDEN);
            }
            lv_arc_set_value(id(arc_progress_value), (int) roundf(qp.value));
            lv_obj_set_style_arc_color(id(arc_progress_value), lv_color_hex(arc_color_or_default(qp.arc_color)),
                                        LV_PART_INDICATOR);
            if (total > 1) {
              char page[20];
              snprintf(page, sizeof(page), "%d / %d", idx + 1, total);
              lv_label_set_text(id(label_progress_page), page);
              lv_obj_clear_flag(id(label_progress_page), LV_OBJ_FLAG_HIDDEN);
              if (idx > 0) lv_obj_clear_flag(id(label_progress_arrow_prev), LV_OBJ_FLAG_HIDDEN);
              else lv_obj_add_flag(id(label_progress_arrow_prev), LV_OBJ_FLAG_HIDDEN);
              if (idx < total - 1) lv_obj_clear_flag(id(label_progress_arrow_next), LV_OBJ_FLAG_HIDDEN);
              else lv_obj_add_flag(id(label_progress_arrow_next), LV_OBJ_FLAG_HIDDEN);
            } else {
              lv_obj_add_flag(id(label_progress_page), LV_OBJ_FLAG_HIDDEN);
              lv_obj_add_flag(id(label_progress_arrow_prev), LV_OBJ_FLAG_HIDDEN);
              lv_obj_add_flag(id(label_progress_arrow_next), LV_OBJ_FLAG_HIDDEN);
            }
          } else {
            lv_label_set_text(id(label_progress_value), "0%");
            lv_obj_add_flag(id(label_progress_title), LV_OBJ_FLAG_HIDDEN);
            lv_arc_set_value(id(arc_progress_value), 0);
            lv_obj_add_flag(id(label_progress_page), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(label_progress_arrow_prev), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(label_progress_arrow_next), LV_OBJ_FLAG_HIDDEN);
          }
      - if:
          condition:
            lambda: 'return id(ui_context) == 6;'
          then:
            - script.execute: update_settings_labels

  - id: refresh_notify
    then:
      - lambda: |-
          auto queue_items = parse_notify_queue(id(notify_queue));
          int total = (int) queue_items.size();
          std::string title, subtitle;
          if (total > 0) {
            int qi = clamp(id(notify_queue_index), 0, total - 1);
            title = queue_items[qi].title;
            subtitle = queue_items[qi].subtitle;
          }
          lv_label_set_text(id(label_notify_title), title.c_str());
          if (!subtitle.empty()) {
            lv_label_set_text(id(label_notify_subtext), subtitle.c_str());
            lv_obj_clear_flag(id(label_notify_subtext), LV_OBJ_FLAG_HIDDEN);
          } else {
            lv_obj_add_flag(id(label_notify_subtext), LV_OBJ_FLAG_HIDDEN);
          }
          int idx = id(notify_queue_index);
          if (idx < 0) idx = 0;
          if (total > 0 && idx >= total) idx = total - 1;
          if (total > 1) {
            char page[20];
            snprintf(page, sizeof(page), "%d / %d", idx + 1, total);
            lv_label_set_text(id(label_notify_page), page);
            lv_obj_clear_flag(id(label_notify_page), LV_OBJ_FLAG_HIDDEN);
            if (idx > 0) lv_obj_clear_flag(id(label_notify_arrow_prev), LV_OBJ_FLAG_HIDDEN);
            else lv_obj_add_flag(id(label_notify_arrow_prev), LV_OBJ_FLAG_HIDDEN);
            if (idx < total - 1) lv_obj_clear_flag(id(label_notify_arrow_next), LV_OBJ_FLAG_HIDDEN);
            else lv_obj_add_flag(id(label_notify_arrow_next), LV_OBJ_FLAG_HIDDEN);
          } else {
            lv_obj_add_flag(id(label_notify_page), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(label_notify_arrow_prev), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(label_notify_arrow_next), LV_OBJ_FLAG_HIDDEN);
          }
      - lambda: |-
          // The arc only appears when the currently shown entry has an
          // "end" date-time (a self-deleting notification) - then it counts
          // down exactly like the Timer screen's arc, elapsed since the
          // entry was added vs. remaining until end. No end set = no arc.
          auto notify_items = parse_notify_queue(id(notify_queue));
          int notify_total = (int) notify_items.size();
          bool show_arc = false;
          int percent = 0;
          if (notify_total > 0) {
            auto &qn = notify_items[clamp(id(notify_queue_index), 0, notify_total - 1)];
            if (!qn.end_time.empty()) {
              show_arc = true;
              auto now = id(ha_time).now();
              long remaining = timer_remaining_seconds(qn.end_time, now);
              uint32_t elapsed = (now.is_valid() && now.timestamp > qn.added_epoch)
                                      ? now.timestamp - qn.added_epoch : 0;
              uint32_t total_secs = elapsed + (uint32_t) (remaining > 0 ? remaining : 0);
              percent = total_secs > 0
                            ? (int) clamp((float) elapsed / (float) total_secs * 100.0f, 0.0f, 100.0f)
                            : 0;
            }
          }
          lv_arc_set_value(id(arc_notify_value), percent);
          if (show_arc) {
            lv_obj_clear_flag(id(arc_notify_track), LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_flag(id(arc_notify_value), LV_OBJ_FLAG_HIDDEN);
            int qi = clamp(id(notify_queue_index), 0, notify_total - 1);
            lv_obj_set_style_arc_color(id(arc_notify_value),
                lv_color_hex(arc_color_or_default(notify_items[qi].arc_color)), LV_PART_INDICATOR);
          } else {
            lv_obj_add_flag(id(arc_notify_track), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(arc_notify_value), LV_OBJ_FLAG_HIDDEN);
          }
      - if:
          condition:
            lambda: 'return id(ui_context) == 6;'
          then:
            - script.execute: update_settings_labels

  # Every activate_*_screen script below (called from timer/progress/notify
  # auto-home, and remotely from the [Standard] Show */Screen HA buttons)
  # is a no-op while the Setup Wizard is showing - nothing may preempt it
  # except wizard_finish itself. See also the connection_state_changed
  # handler in refresh_connection, guarded the same way.
  - id: activate_home_screen
    then:
      - if:
          condition:
            lambda: 'return id(ui_context) != 11;'
          then:
            - lambda: 'ESP_LOGI("diag", "activate_home_screen: switching (was ui_context=%d)", id(ui_context));'
            - script.execute: wake_display
            - lambda: 'id(ui_context) = 0;'
            - script.execute: refresh_temps
            - script.execute: refresh_status
            - lvgl.page.show: screen_home

  - id: activate_timer_screen
    then:
      - if:
          condition:
            lambda: 'return id(ui_context) != 11;'
          then:
            - script.execute: wake_display
            - lambda: 'id(ui_context) = 8; id(timer_queue_index) = 0;'
            - script.execute: refresh_timer
            - lvgl.page.show: screen_timer

  # Short knob press on the Timer screen. Behavior depends on which page is
  # currently shown:
  # - The empty add page (timer_queue_index == total): a click confirms the
  #   knob-previewed duration - the end time is computed from "now" right
  #   here, not baked in earlier while the user was still turning the knob -
  #   and appends a new timer to the queue, using the Timer settings-menu's
  #   LED/blink defaults (no cancel-confirm dialog here - creating one is
  #   cheap/reversible, no need to double-confirm).
  # - A finished real entry (see refresh_timer's remove-hint): a single
  #   press removes it right away, no confirmation needed.
  # - A still-counting real entry: unchanged two-click cancel-confirm dialog
  #   (auto-dismissed after 5s by check_finish_effects), the second click
  #   removes that specific queue entry.
  - id: timer_click
    then:
      - if:
          condition:
            lambda: 'return id(timer_queue_index) >= (int) parse_timer_queue(id(timer_queue)).size();'
          then:
            - if:
                condition:
                  lambda: 'return id(timer_edit_seconds) > 0;'
                then:
                  - lambda: |-
                      auto now = id(ha_time).now();
                      if (!now.is_valid()) return;
                      QueuedTimer qt;
                      char idbuf[24];
                      snprintf(idbuf, sizeof(idbuf), "dev%lu", (unsigned long) id(timer_queue_seq));
                      qt.entry_id = idbuf;
                      qt.title = "";
                      long now_secs = civil_seconds(now.year, now.month, now.day_of_month,
                                                     now.hour, now.minute, now.second);
                      qt.end_time = format_civil_datetime(now_secs + id(timer_edit_seconds));
                      qt.color = blink_led_color_hex(id(timer_blink_led_color_select).current_option());
                      qt.led_mode = id(timer_finish_blink_switch).state ? 2 : 0;
                      qt.value_blink = id(timer_value_blink_switch).state;
                      qt.seq = id(timer_queue_seq)++;
                      qt.added_epoch = now.timestamp;
                      qt.notified = false;
                      if (!id(timer_queue).empty()) id(timer_queue) += "\n";
                      id(timer_queue) += serialize_timer_entry(qt);
                      id(timer_edit_seconds) = -1;
                      int total = (int) parse_timer_queue(id(timer_queue)).size();
                      id(timer_queue_index) = total - 1;
                  - script.execute: refresh_timer
          else:
            - if:
                condition:
                  lambda: |-
                    auto items = parse_timer_queue(id(timer_queue));
                    if (items.empty()) return false;
                    int idx = clamp(id(timer_queue_index), 0, (int) items.size() - 1);
                    return timer_remaining_seconds(items[idx].end_time, id(ha_time).now()) <= 0;
                then:
                  - lambda: |-
                      auto items = parse_timer_queue(id(timer_queue));
                      int idx = clamp(id(timer_queue_index), 0, (int) items.size() - 1);
                      std::string target = items.empty() ? "" : items[idx].entry_id;
                      std::string rebuilt;
                      for (auto &qt : items) {
                        if (qt.entry_id == target) continue;
                        if (!rebuilt.empty()) rebuilt += "\n";
                        rebuilt += serialize_timer_entry(qt);
                      }
                      id(timer_queue) = rebuilt;
                      int total = (int) parse_timer_queue(id(timer_queue)).size();
                      id(timer_queue_index) = clamp(id(timer_queue_index), 0, total);
                  - script.execute: refresh_timer
                else:
                  - if:
                      condition:
                        lambda: 'return id(timer_cancel_confirm_pending);'
                      then:
                        - lambda: |-
                            id(timer_cancel_confirm_pending) = false;
                            lv_obj_add_flag(id(timer_cancel_backdrop), LV_OBJ_FLAG_HIDDEN);
                            lv_obj_add_flag(id(label_timer_cancel_confirm), LV_OBJ_FLAG_HIDDEN);
                            lv_obj_clear_flag(id(arc_timer_track), LV_OBJ_FLAG_HIDDEN);
                            lv_obj_clear_flag(id(arc_timer_value), LV_OBJ_FLAG_HIDDEN);
                            lv_obj_clear_flag(id(label_timer_value), LV_OBJ_FLAG_HIDDEN);
                            auto items = parse_timer_queue(id(timer_queue));
                            int idx = clamp(id(timer_queue_index), 0, (int) items.size() - 1);
                            std::string target = items.empty() ? "" : items[idx].entry_id;
                            std::string rebuilt;
                            for (auto &qt : items) {
                              if (qt.entry_id == target) continue;
                              if (!rebuilt.empty()) rebuilt += "\n";
                              rebuilt += serialize_timer_entry(qt);
                            }
                            id(timer_queue) = rebuilt;
                            int total = (int) parse_timer_queue(id(timer_queue)).size();
                            id(timer_queue_index) = clamp(id(timer_queue_index), 0, total);
                        - script.execute: refresh_timer
                      else:
                        - lambda: |-
                            id(timer_cancel_confirm_pending) = true;
                            id(timer_cancel_confirm_started_ms) = millis();
                            lv_obj_clear_flag(id(timer_cancel_backdrop), LV_OBJ_FLAG_HIDDEN);
                            lv_obj_clear_flag(id(label_timer_cancel_confirm), LV_OBJ_FLAG_HIDDEN);
                            lv_obj_add_flag(id(arc_timer_track), LV_OBJ_FLAG_HIDDEN);
                            lv_obj_add_flag(id(arc_timer_value), LV_OBJ_FLAG_HIDDEN);
                            lv_obj_add_flag(id(label_timer_value), LV_OBJ_FLAG_HIDDEN);
                            lv_obj_add_flag(id(label_timer_title), LV_OBJ_FLAG_HIDDEN);
                            char cancel_body[48];
                            snprintf(cancel_body, sizeof(cancel_body),
                                     id(i18n_translations).translate("timer.cancel_confirm_body").c_str(), 5);
                            std::string cancel_msg =
                                id(i18n_translations).translate("timer.cancel_confirm_title") + "\n" + cancel_body;
                            lv_label_set_text(id(label_timer_cancel_confirm), cancel_msg.c_str());

  - id: activate_progress_screen
    then:
      - if:
          condition:
            lambda: 'return id(ui_context) != 11;'
          then:
            - script.execute: wake_display
            - lambda: 'id(ui_context) = 9; id(progress_queue_index) = 0;'
            - script.execute: refresh_progress
            - lvgl.page.show: screen_progress

  - id: activate_notify_screen
    then:
      - if:
          condition:
            lambda: 'return id(ui_context) != 11;'
          then:
            - script.execute: wake_display
            - lambda: |-
                id(ui_context) = 10;
                id(notify_queue_index) = 0;
                if (id(notify_finished)) id(notify_finished_at_ms) = millis();
            - script.execute: refresh_notify
            - lvgl.page.show: screen_notify

  # First-boot/post-factory-reset setup wizard, and its re-invocation from
  # Settings > System > "Show Setup Guide" (see the settings-menu type-37
  # special case in the central click router). See thermostat_helpers.h's
  # SETTINGS_MENU_COUNT comment for why this is a special "instant action"
  # entry instead of a normal editor screen.
  - id: activate_wizard_screen
    then:
      - script.execute: wake_display
      - lambda: |-
          id(ui_context) = 11;
          id(wizard_page) = 0;
          id(wizard_welcome_started_ms) = millis();
      - script.execute: refresh_wizard
      - lvgl.page.show: screen_wizard

  # Page layout: 0 welcome, 1 language, 2-11 the ten HA-setup steps (step
  # index = page - 2). Two steps gate forward progress on a live condition
  # instead of showing static text - step 1 (page 3, Wi-Fi) waits on
  # id(wifi_id).is_connected(), step 5 (page 7, Home Assistant) waits on
  # id(ha_connected). Once satisfied the text switches from "waiting" to
  # "connected", but the page does not auto-advance - see wizard_next
  # (blocks manual skip-ahead while still unsatisfied).
  - id: refresh_wizard
    then:
      - lambda: |-
          int page = id(wizard_page);
          // Welcome text and the language value share one centered label
          // (label_wizard_welcome) - only one of the two is ever shown at
          // once, so there is no reason for two separate widgets.
          if (page == 0) {
            lv_label_set_text(id(label_wizard_welcome), id(i18n_translations).translate("wizard.welcome").c_str());
            lv_obj_clear_flag(id(label_wizard_welcome), LV_OBJ_FLAG_HIDDEN);
          } else if (page == 1) {
            lv_label_set_text(id(label_wizard_welcome), id(language_select).current_option().c_str());
            lv_obj_clear_flag(id(label_wizard_welcome), LV_OBJ_FLAG_HIDDEN);
          } else {
            lv_obj_add_flag(id(label_wizard_welcome), LV_OBJ_FLAG_HIDDEN);
          }
          if (page == 1) {
            lv_label_set_text(id(label_wizard_lang_hint), id(i18n_translations).translate("wizard.language_hint").c_str());
            lv_obj_clear_flag(id(label_wizard_lang_hint), LV_OBJ_FLAG_HIDDEN);
          } else {
            lv_obj_add_flag(id(label_wizard_lang_hint), LV_OBJ_FLAG_HIDDEN);
          }
          if (page >= 2) {
            static const char *const TITLE_KEYS[10] = {
                "wizard.step0.title", "wizard.step1.title", "wizard.step2.title", "wizard.step3.title",
                "wizard.step4.title", "wizard.step5.title", "wizard.step6.title", "wizard.step7.title",
                "wizard.step8.title", "wizard.step9.title"};
            static const char *const BODY_KEYS[10] = {
                "", "", "wizard.step2.body", "wizard.step3.body",
                "wizard.step4.body", "", "wizard.step6.body", "wizard.step7.body",
                "wizard.step8.body", "wizard.step9.body"};
            int step = page - 2;
            bool is_qr = (step == 0);
            bool is_wifi_gate = (step == 1);
            bool is_ha_gate = (step == 5);
            bool gate_satisfied = is_wifi_gate ? id(wifi_id).is_connected()
                                                : (is_ha_gate ? id(ha_connected) : true);

            lv_label_set_text(id(label_wizard_title), id(i18n_translations).translate(TITLE_KEYS[step]).c_str());
            lv_obj_clear_flag(id(label_wizard_title), LV_OBJ_FLAG_HIDDEN);

            if (is_qr) {
              lv_obj_add_flag(id(wizard_body_viewport), LV_OBJ_FLAG_HIDDEN);
              lv_obj_clear_flag(id(wizard_qrcode), LV_OBJ_FLAG_HIDDEN);
            } else {
              lv_obj_add_flag(id(wizard_qrcode), LV_OBJ_FLAG_HIDDEN);
              std::string body;
              if (is_wifi_gate) {
                body = id(i18n_translations).translate(gate_satisfied ? "wizard.step1.connected" : "wizard.step1.waiting");
              } else if (is_ha_gate) {
                body = id(i18n_translations).translate(gate_satisfied ? "wizard.step5.connected" : "wizard.step5.waiting");
              } else {
                body = id(i18n_translations).translate(BODY_KEYS[step]);
              }
              lv_label_set_text(id(label_wizard_body), body.c_str());
              lv_obj_clear_flag(id(wizard_body_viewport), LV_OBJ_FLAG_HIDDEN);
              // New text (or re-entering this page) always restarts the
              // scroll-in-place cycle from the top, paused, rather than
              // resuming mid-scroll from whatever the previous page left.
              lv_obj_scroll_to_y(id(wizard_body_viewport), 0, LV_ANIM_OFF);
              id(wizard_scroll_pause_until_ms) = millis() + 2000;
            }

            char pagebuf[8];
            snprintf(pagebuf, sizeof(pagebuf), "%d / 10", step + 1);
            lv_label_set_text(id(label_wizard_page), pagebuf);
            lv_obj_clear_flag(id(label_wizard_page), LV_OBJ_FLAG_HIDDEN);
            if (step == 9) {
              lv_label_set_text(id(label_wizard_finish_hint), id(i18n_translations).translate("wizard.finish_hint").c_str());
              lv_obj_clear_flag(id(label_wizard_finish_hint), LV_OBJ_FLAG_HIDDEN);
            } else {
              lv_obj_add_flag(id(label_wizard_finish_hint), LV_OBJ_FLAG_HIDDEN);
            }
          } else {
            lv_obj_add_flag(id(label_wizard_title), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(wizard_body_viewport), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(wizard_qrcode), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(label_wizard_page), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(label_wizard_finish_hint), LV_OBJ_FLAG_HIDDEN);
          }

  # Pressing the knob (or turning it, on the ten step pages) moves one page
  # forward; clamped 0..11, no wrap-around. Page 0 (Welcome) auto-advances
  # after 2s - see check_finish_effects. Pages 3/7 (the Wi-Fi/Home Assistant
  # gates) never auto-advance, even once connected - pressing/turning
  # forward out of one is simply blocked (a no-op) until its condition is
  # satisfied, after which the same press/turn goes through normally.
  - id: wizard_next
    then:
      - script.execute: wake_display
      - lambda: |-
          int page = id(wizard_page);
          int step = page - 2;
          bool blocked = (step == 1 && !id(wifi_id).is_connected()) ||
                          (step == 5 && !id(ha_connected));
          if (!blocked) id(wizard_page) = menu_scroll_index(page, 1, 12);
          ESP_LOGI("diag", "wizard_next: %d -> %d (blocked=%d)", page, id(wizard_page), blocked);
      - script.execute: refresh_wizard

  # Turning the knob backward on a step page (pages 2-11). Always allowed,
  # even out of an unsatisfied gate page - unlike wizard_next, there is
  # nothing to skip ahead of by going back.
  - id: wizard_previous
    then:
      - script.execute: wake_display
      - lambda: 'id(wizard_page) = menu_scroll_index(id(wizard_page), -1, 12);'
      - script.execute: refresh_wizard

  # Knob click on the last step (page 11): turn off setup_wizard_switch (so
  # it no longer auto-starts on the next boot) and resume wherever the
  # device would normally be: straight to screen_home if Home Assistant is
  # already reachable (the Settings > System re-invocation case), otherwise
  # screen_loading, same as on_boot would show - the already-running
  # refresh_connection interval takes it from there once Home Assistant
  # becomes ready. global_preferences->sync() forces the switch state to
  # flash immediately instead of waiting for ESPHome's normal batched
  # write - step 3 of this very wizard has Home Assistant auto-restart the
  # device right after adding the integration, which was landing before the
  # batched write and re-showing the wizard.
  - id: wizard_finish
    then:
      - lambda: |-
          ESP_LOGI("diag", "wizard_finish: page=%d connection_ready=%d", id(wizard_page), id(connection_ready));
          id(setup_wizard_switch).turn_off();
          global_preferences->sync();
      - if:
          condition:
            lambda: 'return id(connection_ready);'
          then:
            - lambda: 'id(ui_context) = 0;'
            - script.execute: refresh_temps
            - script.execute: refresh_status
            - lvgl.page.show: screen_home
          else:
            - lambda: 'id(ui_context) = -1;'
            - lvgl.page.show: screen_loading

  # Swipe navigation between the static notify (if active) and any queued
  # ones - same clamp-at-the-edges behavior as the rest of the menus (no
  # wrap-around).
  - id: notify_previous
    then:
      - script.execute: wake_display
      - lambda: |-
          int total = (int) parse_notify_queue(id(notify_queue)).size();
          id(notify_queue_index) = menu_scroll_index(id(notify_queue_index), -1, total);
      - script.execute: refresh_notify

  - id: notify_next
    then:
      - script.execute: wake_display
      - lambda: |-
          int total = (int) parse_notify_queue(id(notify_queue)).size();
          id(notify_queue_index) = menu_scroll_index(id(notify_queue_index), 1, total);
      - script.execute: refresh_notify

  # HA's input is a human-readable "id=...;title=...;color=RRGGBB;..." string
  # (see parse_notify_entry() in thermostat_helpers.h for the full key
  # list/example) - this just validates it has an id+title, tags on the
  # ESP-assigned seq, and appends it as its own line in the queue.
  - id: notify_add_to_queue
    then:
      - script.execute: wake_display
      - lambda: |-
          std::string raw = id(notify_add_txt).state;
          if (raw.empty()) return;
          QueuedNotify qn = parse_notify_entry(raw);
          if (qn.entry_id.empty() || qn.title.empty()) return;
          qn.seq = id(notify_queue_seq)++;
          if (!qn.end_time.empty()) qn.added_epoch = id(ha_time).now().timestamp;
          if (!id(notify_queue).empty()) id(notify_queue) += "\n";
          id(notify_queue) += serialize_notify_entry(qn);
      - text.set: {id: notify_add_txt, value: ""}
      - script.execute: refresh_notify

  # HA writes the target entry's id to notify_remove_id_txt, then presses
  # this button. Drops the matching entry (if any) and re-serializes the
  # rest back into the queue.
  - id: notify_remove_from_queue
    then:
      - lambda: |-
          std::string target = id(notify_remove_id_txt).state;
          if (target.empty()) return;
          auto items = parse_notify_queue(id(notify_queue));
          std::string rebuilt;
          for (auto &qn : items) {
            if (qn.entry_id == target) continue;
            if (!rebuilt.empty()) rebuilt += "\n";
            rebuilt += serialize_notify_entry(qn);
          }
          id(notify_queue) = rebuilt;
      - text.set: {id: notify_remove_id_txt, value: ""}
      - lambda: |-
          int total = (int) parse_notify_queue(id(notify_queue)).size();
          id(notify_queue_index) = clamp(id(notify_queue_index), 0, total > 0 ? total - 1 : 0);
      - script.execute: refresh_notify

  # HA's input is "id=...;title=...;end=YYYY-MM-DD HH:MM:SS;color=RRGGBB;
  # led_mode=0..2;value_blink=0|1" (see parse_timer_entry() in
  # thermostat_helpers.h) - validates id/title/end are present, tags on the
  # ESP-assigned seq/added timestamp, and appends it to the queue.
  - id: timer_add_to_queue
    then:
      # Without this, an entry added while the display is dimmed/idle
      # renders correctly (arc, value, ...) but stays invisible under the
      # dimmed backlight until something else happens to wake it.
      - script.execute: wake_display
      - lambda: |-
          std::string raw = id(timer_add_txt).state;
          if (raw.empty()) return;
          QueuedTimer qt = parse_timer_entry(raw);
          if (qt.entry_id.empty() || qt.title.empty() || qt.end_time.empty()) return;
          qt.seq = id(timer_queue_seq)++;
          qt.added_epoch = id(ha_time).now().timestamp;
          if (!id(timer_queue).empty()) id(timer_queue) += "\n";
          id(timer_queue) += serialize_timer_entry(qt);
          int total = (int) parse_timer_queue(id(timer_queue)).size();
          id(timer_queue_index) = total - 1;
      - text.set: {id: timer_add_txt, value: ""}
      - script.execute: refresh_timer

  # HA writes the target entry's id to timer_remove_id_txt, then presses
  # this button. Same rebuild-without-the-matching-entry pattern as Notify.
  - id: timer_remove_from_queue
    then:
      - lambda: |-
          std::string target = id(timer_remove_id_txt).state;
          if (target.empty()) return;
          auto items = parse_timer_queue(id(timer_queue));
          std::string rebuilt;
          for (auto &qt : items) {
            if (qt.entry_id == target) continue;
            if (!rebuilt.empty()) rebuilt += "\n";
            rebuilt += serialize_timer_entry(qt);
          }
          id(timer_queue) = rebuilt;
      - text.set: {id: timer_remove_id_txt, value: ""}
      - lambda: |-
          int total = (int) parse_timer_queue(id(timer_queue)).size();
          id(timer_queue_index) = clamp(id(timer_queue_index), 0, total);
      - script.execute: refresh_timer

  # HA's input is "id=...;title=...;value=0..100;color=RRGGBB;led_mode=0..2;
  # value_blink=0|1" - sending the same id again replaces that entry
  # (upsert), which is how HA updates a running percentage over time.
  - id: progress_add_to_queue
    then:
      - script.execute: wake_display
      - lambda: |-
          std::string raw = id(progress_add_txt).state;
          if (raw.empty()) return;
          QueuedProgress qp = parse_progress_entry(raw);
          if (qp.entry_id.empty() || qp.title.empty()) return;
          auto items = parse_progress_queue(id(progress_queue));
          bool replaced = false;
          std::string rebuilt;
          for (auto &existing : items) {
            if (existing.entry_id == qp.entry_id) {
              qp.seq = existing.seq;
              replaced = true;
            }
            if (!rebuilt.empty()) rebuilt += "\n";
            rebuilt += serialize_progress_entry(existing.entry_id == qp.entry_id ? qp : existing);
          }
          if (!replaced) {
            qp.seq = id(progress_queue_seq)++;
            if (!rebuilt.empty()) rebuilt += "\n";
            rebuilt += serialize_progress_entry(qp);
          }
          id(progress_queue) = rebuilt;
      - text.set: {id: progress_add_txt, value: ""}
      - script.execute: refresh_progress

  - id: progress_remove_from_queue
    then:
      - lambda: |-
          std::string target = id(progress_remove_id_txt).state;
          if (target.empty()) return;
          auto items = parse_progress_queue(id(progress_queue));
          std::string rebuilt;
          for (auto &qp : items) {
            if (qp.entry_id == target) continue;
            if (!rebuilt.empty()) rebuilt += "\n";
            rebuilt += serialize_progress_entry(qp);
          }
          id(progress_queue) = rebuilt;
      - text.set: {id: progress_remove_id_txt, value: ""}
      - lambda: |-
          int total = (int) parse_progress_queue(id(progress_queue)).size();
          id(progress_queue_index) = clamp(id(progress_queue_index), 0, total > 0 ? total - 1 : 0);
      - script.execute: refresh_progress

  # Swipe navigation on the Timer screen. Unlike Notify/Progress, the Timer
  # queue has one extra virtual slot past the real entries (index == total)
  # - the empty "add a new timer" page - so it scrolls one step further.
  - id: timer_previous
    then:
      - script.execute: wake_display
      - lambda: |-
          int total = (int) parse_timer_queue(id(timer_queue)).size();
          id(timer_queue_index) = menu_scroll_index(id(timer_queue_index), -1, total + 1);
      - script.execute: refresh_timer

  - id: timer_next
    then:
      - script.execute: wake_display
      - lambda: |-
          int total = (int) parse_timer_queue(id(timer_queue)).size();
          id(timer_queue_index) = menu_scroll_index(id(timer_queue_index), 1, total + 1);
      - script.execute: refresh_timer

  - id: progress_previous
    then:
      - script.execute: wake_display
      - lambda: |-
          int total = (int) parse_progress_queue(id(progress_queue)).size();
          id(progress_queue_index) = menu_scroll_index(id(progress_queue_index), -1, total);
      - script.execute: refresh_progress

  - id: progress_next
    then:
      - script.execute: wake_display
      - lambda: |-
          int total = (int) parse_progress_queue(id(progress_queue)).size();
          id(progress_queue_index) = menu_scroll_index(id(progress_queue_index), 1, total);
      - script.execute: refresh_progress

  # Runs every 500ms (see the interval: block). Handles what happens once a
  # timer/progress has finished: an optional status-LED blink (in the
  # respective *_blink_led_color_select color, only while still on that
  # screen - see update_status_led), an optional blink of the big value label (only
  # while its screen is actually visible), and an optional auto-return-home
  # after a configurable delay. Recomputes from scratch each tick instead of
  # tracking extra "is blinking" state, so turning a blink switch off (or the
  # countdown/value resetting) cleans up within one tick without any separate
  # teardown logic.
  - id: check_finish_effects
    then:
      - if:
          condition:
            lambda: |-
              return id(ui_context) == 11 && id(wizard_page) == 0 &&
                     millis() - id(wizard_welcome_started_ms) >= 2000;
          then:
            - script.execute: wizard_next
      # Auto-scroll wizard_body_viewport top-to-bottom-to-top whenever its
      # text overflows the fixed-height container - only while the wizard
      # is actually showing a body-text step (not hidden by the QR/gate
      # pages). Pauses ~2s at each end so the text is readable, otherwise
      # nudges down a few px per tick. lv_obj_scroll_by's dy is inverted:
      # negative reveals content further down (see lv_obj_scroll.h docs).
      - if:
          condition:
            lambda: |-
              return id(ui_context) == 11 && id(wizard_page) >= 2 &&
                     !lv_obj_has_flag(id(wizard_body_viewport), LV_OBJ_FLAG_HIDDEN) &&
                     millis() >= id(wizard_scroll_pause_until_ms);
          then:
            - lambda: |-
                lv_obj_t *vp = id(wizard_body_viewport);
                int32_t remaining = lv_obj_get_scroll_bottom(vp);
                if (remaining <= 0) {
                  if (lv_obj_get_scroll_y(vp) > 0) {
                    // Reached the bottom - snap back to the top and pause
                    // there before the next scroll pass begins.
                    lv_obj_scroll_to_y(vp, 0, LV_ANIM_OFF);
                  }
                  // No overflow at all, or just snapped back to the top -
                  // hold for a moment either way.
                  id(wizard_scroll_pause_until_ms) = millis() + 2000;
                } else {
                  int32_t step = remaining < 6 ? remaining : 6;
                  lv_obj_scroll_by(vp, 0, -step, LV_ANIM_OFF);
                  if (lv_obj_get_scroll_bottom(vp) <= 0) {
                    id(wizard_scroll_pause_until_ms) = millis() + 2000;
                  }
                }
      - lambda: |-
          // Timer: each entry's "finished" state is computed live from its
          // own end_time (remaining <= 0) - no stored finished flag needed.
          // `notified` is a one-shot flag serialized into the entry itself,
          // flipped the first time it crosses zero, so the auto-show action
          // below fires once per entry instead of every tick. Entries stay
          // in the queue (blinking/counting as finished) until removed -
          // no self-delete, unlike Notify's optional "end" field.
          id(timer_just_finished_any) = false;
          {
            auto items = parse_timer_queue(id(timer_queue));
            auto now = id(ha_time).now();
            bool any_newly_notified = false;
            std::string rebuilt;
            for (size_t i = 0; i < items.size(); i++) {
              auto &qt = items[i];
              if (!qt.notified && timer_remaining_seconds(qt.end_time, now) <= 0) {
                qt.notified = true;
                any_newly_notified = true;
                id(timer_just_finished_any) = true;
                id(timer_last_finished_index) = (int) i;
              }
              if (!rebuilt.empty()) rebuilt += "\n";
              rebuilt += serialize_timer_entry(qt);
            }
            if (any_newly_notified) id(timer_queue) = rebuilt;
          }
          // Progress: same one-shot notified pattern, "finished" = value >= 100.
          // finished_at_ms is captured here (Progress has no end-time to derive
          // elapsed-since-finished from the way Timer can) and anchors its
          // Auto-Home delay below.
          id(progress_just_finished_any) = false;
          {
            auto items = parse_progress_queue(id(progress_queue));
            bool any_newly_notified = false;
            std::string rebuilt;
            for (size_t i = 0; i < items.size(); i++) {
              auto &qp = items[i];
              if (!qp.notified && qp.value >= 100.0f) {
                qp.notified = true;
                qp.finished_at_ms = millis();
                any_newly_notified = true;
                id(progress_just_finished_any) = true;
                id(progress_last_finished_index) = (int) i;
              }
              if (!rebuilt.empty()) rebuilt += "\n";
              rebuilt += serialize_progress_entry(qp);
            }
            if (any_newly_notified) id(progress_queue) = rebuilt;
          }
          // Self-deleting entries (those with an "end" date-time) drop
          // themselves from the queue once that time passes - same
          // countdown-to-zero semantics as the Timer screen, just per-entry.
          // Rebuilt without re-sorting since storage order doesn't matter
          // (parse_notify_queue() re-sorts on every read anyway).
          {
            auto notify_all = parse_notify_queue(id(notify_queue));
            auto notify_now = id(ha_time).now();
            bool notify_expired_any = false;
            std::string notify_rebuilt;
            for (auto &qn : notify_all) {
              if (!qn.end_time.empty() && timer_remaining_seconds(qn.end_time, notify_now) <= 0) {
                notify_expired_any = true;
                continue;
              }
              if (!notify_rebuilt.empty()) notify_rebuilt += "\n";
              notify_rebuilt += serialize_notify_entry(qn);
            }
            if (notify_expired_any) {
              id(notify_queue) = notify_rebuilt;
              int notify_new_total = (int) parse_notify_queue(id(notify_queue)).size();
              id(notify_queue_index) = clamp(id(notify_queue_index), 0, notify_new_total > 0 ? notify_new_total - 1 : 0);
              // Live-update the screen immediately if it's the one currently
              // shown, instead of waiting for the next swipe/manual refresh.
              if (id(ui_context) == 10) id(refresh_notify).execute();
            }
          }
          // Notify has no threshold to cross - it's "finished" (active) the
          // instant the queue gets an entry, and stays that way until it's
          // emptied again. notify_just_finished latches for exactly one tick
          // on that empty->non-empty transition, driving the auto-show below.
          id(notify_just_finished) = false;
          bool notify_active = !parse_notify_queue(id(notify_queue)).empty();
          if (notify_active) {
            if (!id(notify_finished)) {
              id(notify_finished) = true;
              id(notify_finished_at_ms) = millis();
              id(notify_just_finished) = true;
            }
          } else {
            id(notify_finished) = false;
          }
      # The queue can become empty while its screen is being looked at -
      # either an entry expiring above, or HA removing the last one via
      # notify_remove_from_queue/progress_remove_from_queue. Unlike the
      # delay-based Auto-Home below (which only applies to an entry that
      # finished and is still sitting there), an empty queue has nothing
      # left to show at all, so this leaves immediately rather than waiting
      # for notify_auto_home_num/progress_auto_home_num.
      - if:
          condition:
            lambda: 'return id(ui_context) == 10 && parse_notify_queue(id(notify_queue)).empty();'
          then:
            - script.execute: activate_home_screen
      - if:
          condition:
            lambda: 'return id(ui_context) == 9 && parse_progress_queue(id(progress_queue)).empty();'
          then:
            - script.execute: activate_home_screen
      # Gated on connection_ready so a timer/progress that had already
      # finished before a reboot (its end time/value survives via restored
      # entity state) can't hijack the very first screen after boot - normal
      # boot always lands on screen_home first (see refresh_connection),
      # and only finishes occurring after that point auto-show their screen.
      # All three auto-show conditions below also require ui_context != 11 -
      # nothing may preempt the Setup Wizard, see activate_home_screen.
      - if:
          condition:
            lambda: |-
              return id(connection_ready) && id(ui_context) != 11 && id(timer_just_finished_any) &&
                     id(timer_show_on_finish_switch).state;
          then:
            - script.execute: wake_display
            - lambda: |-
                id(ui_context) = 8;
                id(timer_queue_index) = id(timer_last_finished_index);
            - script.execute: refresh_timer
            - lvgl.page.show: screen_timer
      # Progress always auto-shows once an entry finishes - no toggle for
      # this anymore, same as Notify (the per-entry LED settings replaced
      # the old global Progress switches, including the show-on-finish one).
      - if:
          condition:
            lambda: 'return id(connection_ready) && id(ui_context) != 11 && id(progress_just_finished_any);'
          then:
            - script.execute: wake_display
            - lambda: |-
                id(ui_context) = 9;
                id(progress_queue_index) = id(progress_last_finished_index);
            - script.execute: refresh_progress
            - lvgl.page.show: screen_progress
      # Notify always auto-shows once at least one notification is queued -
      # there's no toggle for this (removing the queue's only entry and
      # adding a new one re-triggers it, same as Timer/Progress finishing).
      - if:
          condition:
            lambda: 'return id(connection_ready) && id(ui_context) != 11 && id(notify_just_finished);'
          then:
            - script.execute: wake_display
            - lambda: |-
                id(ui_context) = 10;
                id(notify_queue_index) = 0;
            - script.execute: refresh_notify
            - lvgl.page.show: screen_notify
      # LED/value-label blinking and Auto-Home both read whichever entry is
      # currently displayed on its screen - live-computed "finished" state
      # (Timer: remaining <= 0; Progress: value >= 100) plus that entry's own
      # led_mode/value_blink fields (Notify already worked this way). A
      # finished entry that isn't being looked at keeps counting/blinking in
      # the queue - it's simply not driving the LED/value label right now.
      - lambda: |-
          auto timer_items = parse_timer_queue(id(timer_queue));
          int timer_total = (int) timer_items.size();
          bool timer_finished_now = false;
          int timer_led_mode = 0;
          bool timer_value_blink_enabled = false;
          long timer_remaining = 0;
          if (id(ui_context) == 8 && id(timer_queue_index) < timer_total) {
            auto &qt = timer_items[id(timer_queue_index)];
            timer_remaining = timer_remaining_seconds(qt.end_time, id(ha_time).now());
            timer_finished_now = timer_remaining <= 0;
            timer_led_mode = qt.led_mode;
            timer_value_blink_enabled = qt.value_blink;
          }
          bool timer_led_blinking = timer_finished_now && timer_led_mode == 2;

          auto progress_items = parse_progress_queue(id(progress_queue));
          int progress_total = (int) progress_items.size();
          bool progress_finished_now = false;
          int progress_led_mode = 0;
          bool progress_value_blink_enabled = false;
          if (id(ui_context) == 9 && id(progress_queue_index) < progress_total) {
            auto &qp = progress_items[id(progress_queue_index)];
            progress_finished_now = qp.value >= 100.0f;
            progress_led_mode = qp.led_mode;
            progress_value_blink_enabled = qp.value_blink;
          }
          bool progress_led_blinking = progress_finished_now && progress_led_mode == 2;

          // Both the LED mode (off/on/blink) and whether the value label
          // also blinks come from the currently shown queue entry itself.
          auto notify_queue_items = parse_notify_queue(id(notify_queue));
          int notify_total = (int) notify_queue_items.size();
          int notify_led_mode = 0;
          bool notify_value_blink_enabled = false;
          if (id(ui_context) == 10 && id(notify_finished) && notify_total > 0) {
            int notify_qi = clamp(id(notify_queue_index), 0, notify_total - 1);
            notify_led_mode = notify_queue_items[notify_qi].led_mode;
            notify_value_blink_enabled = notify_queue_items[notify_qi].value_blink;
          }
          bool notify_led_blinking = notify_led_mode == 2;
          id(blink_led_on) = (timer_led_blinking || progress_led_blinking || notify_led_blinking)
                                  ? !id(blink_led_on) : false;

          lv_obj_t *timer_value = id(label_timer_value);
          bool timer_value_blinking = timer_finished_now && timer_value_blink_enabled;
          lv_obj_set_style_text_opa(timer_value,
              (timer_value_blinking && !id(blink_led_on)) ? LV_OPA_TRANSP : LV_OPA_COVER,
              LV_PART_MAIN);

          lv_obj_t *progress_value = id(label_progress_value);
          bool progress_value_blinking = progress_finished_now && progress_value_blink_enabled;
          lv_obj_set_style_text_opa(progress_value,
              (progress_value_blinking && !id(blink_led_on)) ? LV_OPA_TRANSP : LV_OPA_COVER,
              LV_PART_MAIN);

          lv_obj_t *notify_title = id(label_notify_title);
          lv_obj_set_style_text_opa(notify_title,
              (notify_value_blink_enabled && !id(blink_led_on)) ? LV_OPA_TRANSP : LV_OPA_COVER,
              LV_PART_MAIN);
      - script.execute: update_status_led
      - if:
          condition:
            lambda: |-
              auto items = parse_timer_queue(id(timer_queue));
              int total = (int) items.size();
              int delay = (int) id(timer_auto_home_num).state;
              if (id(ui_context) != 8 || delay <= 0 || id(timer_queue_index) >= total) return false;
              long remaining = timer_remaining_seconds(items[id(timer_queue_index)].end_time, id(ha_time).now());
              return remaining <= 0 && -remaining >= delay;
          then:
            - script.execute: activate_home_screen
      - if:
          condition:
            lambda: |-
              auto items = parse_progress_queue(id(progress_queue));
              int total = (int) items.size();
              int delay = (int) id(progress_auto_home_num).state;
              if (id(ui_context) != 9 || delay <= 0 || id(progress_queue_index) >= total) return false;
              auto &qp = items[id(progress_queue_index)];
              return qp.value >= 100.0f && qp.finished_at_ms != 0 &&
                     millis() - qp.finished_at_ms >= (uint32_t) delay * 1000;
          then:
            - script.execute: activate_home_screen
      - if:
          condition:
            lambda: |-
              int delay = (int) id(notify_auto_home_num).state;
              return id(ui_context) == 10 && id(notify_finished) && delay > 0 &&
                     millis() - id(notify_finished_at_ms) >= (uint32_t) delay * 1000;
          then:
            - script.execute: activate_home_screen
      # Cancel-confirm dialog: dismiss itself after 5s, or immediately if the
      # user has already swiped away from the Timer screen. While it's up,
      # count down the seconds left in its own text.
      - if:
          condition:
            lambda: 'return id(timer_cancel_confirm_pending);'
          then:
            - if:
                condition:
                  lambda: |-
                    return id(ui_context) != 8 ||
                           millis() - id(timer_cancel_confirm_started_ms) >= 5000;
                then:
                  - lambda: |-
                      id(timer_cancel_confirm_pending) = false;
                      lv_obj_add_flag(id(timer_cancel_backdrop), LV_OBJ_FLAG_HIDDEN);
                      lv_obj_add_flag(id(label_timer_cancel_confirm), LV_OBJ_FLAG_HIDDEN);
                  - script.execute: refresh_timer
                else:
                  - lambda: |-
                      uint32_t elapsed = millis() - id(timer_cancel_confirm_started_ms);
                      int remaining = 5 - (int) (elapsed / 1000);
                      if (remaining < 0) remaining = 0;
                      char cancel_body[48];
                      snprintf(cancel_body, sizeof(cancel_body),
                               id(i18n_translations).translate("timer.cancel_confirm_body").c_str(), remaining);
                      std::string cancel_msg =
                          id(i18n_translations).translate("timer.cancel_confirm_title") + "\n" + cancel_body;
                      lv_label_set_text(id(label_timer_cancel_confirm), cancel_msg.c_str());

  - id: toggle_adjust_target
    then:
      - if:
          condition:
            lambda: 'return !std::isnan(id(target_low_v)) && !std::isnan(id(target_high_v));'
          then:
            # Real dual-setpoint entity (heat_cool): switch between low (TRV)
            # and high (AC).
            - lambda: |-
                id(adjust_target) = 1 - id(adjust_target);
                id(target_temperature) = id(adjust_target) == 1 ? id(target_high_v) : id(target_low_v);
                auto &climate = id(ha_climates).get_mutable(id(climate_index));
                climate.adjust_target = id(adjust_target);
            - script.execute: refresh_temps
            - script.execute: refresh_status
          else:
            # better_thermostat style: one temperature attribute; TRV = heat
            # mode, AC = cool mode, so toggle the mode.
            - if:
                condition:
                  lambda: |-
                    auto v = ha_parse_list(id(hvac_modes_raw));
                    bool h = false, c = false;
                    for (auto &m : v) { if (m == "heat") h = true; if (m == "cool") c = true; }
                    return h && c;
                then:
                  - homeassistant.service:
                      service: climate.set_hvac_mode
                      data:
                        entity_id: !lambda 'return id(ha_climates).get(id(climate_index)).entity_id;'
                        hvac_mode: !lambda |-
                          return id(current_hvac_raw) == "cool" ? std::string("heat") : std::string("cool");

  # Status LED hook. Boards with an LED strip extend this placeholder; boards
  # without one keep it empty.
  - id: update_status_led
    then: []

  # Live preview for LED brightness while rotating in the settings submenu.
  # The 240x240 board overrides this placeholder with `!extend`.
  - id: preview_led_brightness
    then: []

  # All temperature/humidity labels and ring fill level.
  - id: refresh_temps
    then:
      - lvgl.label.update:
          id: label_climate_name
          text: !lambda |-
            const std::string name = id(ha_climates).empty() ? std::string() :
                                     id(ha_climates).get(id(climate_index)).name;
            return ha_text_or_placeholder(id(connection_ready), name, 10);
      - lvgl.label.update:
          id: label_climate_page
          text: !lambda |-
            if (!id(connection_ready))
              return ha_text_or_placeholder(false, std::string(), 5);
            if (id(ha_climates).empty()) return std::string("0 / 0");
            char page[20];
            snprintf(page, sizeof(page), "%d / %d", id(climate_index) + 1,
                     (int) id(ha_climates).size());
            return std::string(page);
      # Icon glyphs from thermostat_helpers.h; keep PUA characters out of YAML.
      - lvgl.label.update:
          id: icon_thermo_current
          text: !lambda 'return std::string(ICON_THERMO_HIGH);'
      - lvgl.widget.update:
          id: icon_thermo_current
          text_color: !lambda 'return lv_color_hex(0xFF5A2D);'
      - lvgl.label.update:
          id: icon_hum_thermo
          text: !lambda 'return std::string(ICON_DROPLET_HALF);'
      - lvgl.widget.update:
          id: icon_hum_thermo
          text_color: !lambda 'return lv_color_hex(0x6EC6FF);'
      # TRV/AC indicator, visible only in dual-setpoint mode.
      - if:
          condition:
            lambda: |-
              return !id(connection_ready) ||
                     (!std::isnan(id(target_low_v)) && !std::isnan(id(target_high_v)));
          then:
            - lvgl.label.update:
                id: label_setpoint_mode
                text: !lambda |-
                  const std::string mode = id(adjust_target) == 1 ? "AC" : "TRV";
                  return ha_text_or_placeholder(id(connection_ready), mode, 3);
            - lvgl.widget.show: label_setpoint_mode
          else:
            - lvgl.widget.hide: label_setpoint_mode
      - lvgl.label.update:
          id: label_target_temperature
          text: !lambda |-
            bool f = id(unit_select).current_option() == "Fahrenheit";
            return ha_text_or_placeholder(id(connection_ready),
                                          to_string((int) display_temp(id(target_temperature), f)), 2);
      - lvgl.label.update:
          id: label_target_decimal
          text: !lambda |-
            bool f = id(unit_select).current_option() == "Fahrenheit";
            float t = display_temp(id(target_temperature), f);
            int frac = (int) roundf((t - (int) t) * 10.0f);
            char buf[8];
            snprintf(buf, sizeof(buf), ".%d", abs(frac));
            return ha_text_or_placeholder(id(connection_ready), std::string(buf), 2);
      - lvgl.label.update:
          id: label_target_unit
          text: !lambda |-
            const std::string unit = id(unit_select).current_option() == "Fahrenheit" ? "°F" : "°C";
            return ha_text_or_placeholder(id(connection_ready), unit, 2);
      - lvgl.label.update:
          id: label_current_temperature
          text: !lambda |-
            bool f = id(unit_select).current_option() == "Fahrenheit";
            char buf[16];
            snprintf(buf, sizeof(buf), "%.1f°", display_temp(id(pending_current_temperature), f));
            return ha_text_or_placeholder(id(connection_ready), std::string(buf), 5);
      - lvgl.label.update:
          id: label_home_current_temperature
          text: !lambda |-
            bool f = id(unit_select).current_option() == "Fahrenheit";
            return ha_text_or_placeholder(id(connection_ready),
                                          to_string((int) display_temp(id(pending_current_temperature), f)), 2);
      - lvgl.label.update:
          id: label_home_current_decimal
          text: !lambda |-
            bool f = id(unit_select).current_option() == "Fahrenheit";
            float c = display_temp(id(pending_current_temperature), f);
            int frac = (int) roundf((c - (int) c) * 10.0f);
            char buf[8];
            snprintf(buf, sizeof(buf), ".%d", abs(frac));
            return ha_text_or_placeholder(id(connection_ready), std::string(buf), 2);
      - lvgl.label.update:
          id: label_home_current_unit
          text: !lambda |-
            const std::string unit = id(unit_select).current_option() == "Fahrenheit" ? "°F" : "°C";
            return ha_text_or_placeholder(id(connection_ready), unit, 2);
      # Two independent setpoint handles share the same neutral track. Heat
      # fills from the left; cool uses REVERSE mode and fills from the right.
      # Animate the underlying arc value so its indicator and knob move as one.
      # Restarting from the currently rendered value also keeps quick encoder
      # turns fluid instead of snapping between consecutive temperature steps.
      - lambda: |-
          lv_anim_exec_xcb_t set_arc_value = [](void *var, int32_t value) {
            lv_arc_set_value(static_cast<lv_obj_t *>(var), value);
          };
          auto animate_arc_to = [set_arc_value](lv_obj_t *arc, int32_t target) {
            target = clamp(target, (int32_t) 0, (int32_t) 100);
            int32_t current = lv_arc_get_value(arc);
            lv_anim_delete(arc, set_arc_value);
            if (current == target) return;

            lv_anim_t anim;
            lv_anim_init(&anim);
            lv_anim_set_var(&anim, arc);
            lv_anim_set_values(&anim, current, target);
            lv_anim_set_time(&anim, 180);
            lv_anim_set_path_cb(&anim, lv_anim_path_ease_out);
            lv_anim_set_exec_cb(&anim, set_arc_value);
            lv_anim_start(&anim);
          };

          auto normalize_temperature = [](float temperature) {
            return clamp((int32_t) roundf((temperature - ${temperature_min}) /
                                          (${temperature_max} - ${temperature_min}) * 100.0f),
                         (int32_t) 0, (int32_t) 100);
          };

          float heat_target = !std::isnan(id(target_low_v))
                                  ? id(target_low_v) : id(target_temperature);
          float cool_target = !std::isnan(id(target_high_v))
                                  ? id(target_high_v) : id(target_temperature);
          int32_t cool_normalized = normalize_temperature(cool_target);

          animate_arc_to(id(arc_temperature_heat), normalize_temperature(heat_target));
          // REVERSE places internal value 0 at the right-hand end. Inverting
          // the visual value keeps minimum temperature on the left like HA.
          animate_arc_to(id(arc_temperature_cool), 100 - cool_normalized);
          animate_arc_to(id(arc_temperature_current),
                         normalize_temperature(id(pending_current_temperature)));
      - if:
          condition:
            lambda: |-
              if (!std::isnan(id(target_low_v))) return true;
              for (const auto &mode : ha_parse_list(id(hvac_modes_raw)))
                if (mode == "heat" || mode == "heat_cool" || mode == "auto") return true;
              return id(current_hvac_raw) == "heat" || id(current_hvac_raw) == "heat_cool";
          then:
            - lvgl.widget.show: arc_temperature_heat
          else:
            - lvgl.widget.hide: arc_temperature_heat
      - if:
          condition:
            lambda: |-
              if (!std::isnan(id(target_high_v))) return true;
              for (const auto &mode : ha_parse_list(id(hvac_modes_raw)))
                if (mode == "cool" || mode == "heat_cool" || mode == "auto") return true;
              return id(current_hvac_raw) == "cool" || id(current_hvac_raw) == "heat_cool"
                     || id(current_hvac_raw) == "dry"
                     || id(current_hvac_raw) == "fan_only";
          then:
            - lvgl.widget.show: arc_temperature_cool
          else:
            - lvgl.widget.hide: arc_temperature_cool
      # Humidity, only visible when a value exists.
      - if:
          condition:
            lambda: 'return !id(connection_ready) || !std::isnan(id(pending_humidity));'
          then:
            - lvgl.label.update:
                id: label_humidity_thermo
                text: !lambda |-
                  char buf[8];
                  snprintf(buf, sizeof(buf), "%.0f%%", id(pending_humidity));
                  return ha_text_or_placeholder(id(connection_ready), std::string(buf), 3);
            - lvgl.label.update:
                id: label_home_humidity
                text: !lambda |-
                  char buf[8];
                  snprintf(buf, sizeof(buf), "%.0f%%", id(pending_humidity));
                  return ha_text_or_placeholder(id(connection_ready), std::string(buf), 3);
            - lvgl.widget.show: label_humidity_thermo
            - lvgl.widget.show: label_home_humidity
            - if:
                condition:
                  lambda: 'return id(connection_ready);'
                then:
                  - lvgl.widget.show: icon_hum_thermo
                else:
                  - lvgl.widget.hide: icon_hum_thermo
          else:
            - lvgl.widget.hide: label_humidity_thermo
            - lvgl.widget.hide: label_home_humidity
            - lvgl.widget.hide: icon_hum_thermo
      - if:
          condition:
            lambda: 'return id(connection_ready);'
          then:
            - lvgl.widget.show: icon_thermo_current
          else:
            - lvgl.widget.hide: icon_thermo_current

  # Status lines, mode icons, and ring color.
  - id: refresh_status
    then:
      - lvgl.label.update:
          id: label_hvac_mode
          text: !lambda |-
            std::string hvac_key = ha_hvac_mode_key(id(current_hvac_raw));
            std::string hvac_label = hvac_key.empty() ? "-" : id(i18n_translations).translate(hvac_key);
            return ha_text_or_placeholder(id(connection_ready), hvac_label, 6);
      - lvgl.label.update:
          id: label_home_hvac_mode
          text: !lambda |-
            std::string hvac_key = ha_hvac_mode_key(id(current_hvac_raw));
            std::string hvac_label = hvac_key.empty() ? "-" : id(i18n_translations).translate(hvac_key);
            return ha_text_or_placeholder(id(connection_ready), hvac_label, 6);
      - lvgl.label.update:
          id: label_preset
          text: !lambda |-
            std::string preset_key = ha_preset_key(id(current_preset_raw));
            std::string preset_label = !preset_key.empty()
                ? id(i18n_translations).translate(preset_key)
                : (id(current_preset_raw).empty() ? std::string("-") : id(current_preset_raw));
            return ha_text_or_placeholder(id(connection_ready), preset_label, 6);
      - lvgl.label.update:
          id: label_home_preset
          text: !lambda |-
            std::string preset_key = ha_preset_key(id(current_preset_raw));
            std::string preset_label = !preset_key.empty()
                ? id(i18n_translations).translate(preset_key)
                : (id(current_preset_raw).empty() ? std::string("-") : id(current_preset_raw));
            return ha_text_or_placeholder(id(connection_ready), preset_label, 6);
      - lvgl.label.update:
          id: icon_mode_thermo
          text: !lambda |-
            if (id(current_hvac_raw) == "off") return std::string(ICON_POWER);
            if (!std::isnan(id(target_low_v)) && !std::isnan(id(target_high_v)))
              return std::string(id(adjust_target) == 1 ? ICON_SNOW : ICON_FIRE);
            if (id(current_hvac_raw) == "cool" || id(current_hvac_raw) == "dry"
                || id(current_hvac_raw) == "fan_only") return std::string(ICON_SNOW);
            return std::string(ICON_FIRE);
      - lvgl.label.update:
          id: icon_mode_home
          text: !lambda |-
            if (id(current_hvac_raw) == "off") return std::string(ICON_POWER);
            if (!std::isnan(id(target_low_v)) && !std::isnan(id(target_high_v)))
              return std::string(id(adjust_target) == 1 ? ICON_SNOW : ICON_FIRE);
            if (id(current_hvac_raw) == "cool" || id(current_hvac_raw) == "dry"
                || id(current_hvac_raw) == "fan_only") return std::string(ICON_SNOW);
            return std::string(ICON_FIRE);
      - lvgl.widget.update:
          id: icon_mode_thermo
          text_color: !lambda |-
            // No active heating/cooling phase (idle/off): use dark gray.
            if (id(current_action_raw) != "heating" && id(current_action_raw) != "cooling")
              return lv_color_hex(0x9A9A9A);
            // Active AC target: snow icon is always blue.
            if (!std::isnan(id(target_low_v)) && !std::isnan(id(target_high_v)) && id(adjust_target) == 1)
              return lv_color_hex(0x6EC6FF);
            if (id(current_hvac_raw) == "cool" || id(current_hvac_raw) == "dry"
                || id(current_hvac_raw) == "fan_only") return lv_color_hex(0x6EC6FF);
            return lv_color_hex(0xFF8A3D);
      - lvgl.widget.update:
          id: icon_mode_home
          text_color: !lambda |-
            // No active heating/cooling phase (idle/off): use dark gray.
            if (id(current_action_raw) != "heating" && id(current_action_raw) != "cooling")
              return lv_color_hex(0x9A9A9A);
            // Active AC target: snow icon is always blue.
            if (!std::isnan(id(target_low_v)) && !std::isnan(id(target_high_v)) && id(adjust_target) == 1)
              return lv_color_hex(0x6EC6FF);
            if (id(current_hvac_raw) == "cool" || id(current_hvac_raw) == "dry"
                || id(current_hvac_raw) == "fan_only") return lv_color_hex(0x6EC6FF);
            return lv_color_hex(0xFF8A3D);
      # Keep both setpoint markers visible at once. Switching TRV/AC still only
      # changes `adjust_target`; it does not hide the other setpoint.
      - lvgl.arc.update:
          id: arc_temperature_heat
          indicator:
            arc_opa: !lambda |-
              return id(current_hvac_raw) == "off" ? LV_OPA_TRANSP : LV_OPA_COVER;
          knob:
            bg_opa: !lambda |-
              return id(current_hvac_raw) == "off" ? LV_OPA_TRANSP : LV_OPA_COVER;
            border_opa: !lambda |-
              return id(current_hvac_raw) == "off" ? LV_OPA_TRANSP : LV_OPA_COVER;
      - lvgl.arc.update:
          id: arc_temperature_cool
          indicator:
            arc_opa: !lambda |-
              return id(current_hvac_raw) == "off" ? LV_OPA_TRANSP : LV_OPA_COVER;
          knob:
            bg_opa: !lambda |-
              return id(current_hvac_raw) == "off" ? LV_OPA_TRANSP : LV_OPA_COVER;
            border_opa: !lambda |-
              return id(current_hvac_raw) == "off" ? LV_OPA_TRANSP : LV_OPA_COVER;
      - if:
          condition:
            lambda: 'return id(connection_ready);'
          then:
            - lvgl.widget.show: icon_mode_thermo
            - lvgl.widget.show: icon_mode_home
          else:
            - lvgl.widget.hide: icon_mode_thermo
            - lvgl.widget.hide: icon_mode_home
      - script.execute: update_status_led

  # Staged connection diagnostics: WiFi -> HA API -> climate entity.
  - id: refresh_connection
    mode: restart
    then:
      - if:
          condition:
            wifi.connected:
          then:
            - lambda: |-
                id(connection_ready) = false;
                if (!id(ha_connected)) {
                  id(connection_message) = millis() < 60000
                      ? "HA connecting..." : "HA unreachable";
                  return;
                }
                if (id(ha_climates).config_error() || id(ha_lights).config_error() ||
                    id(ha_covers).config_error()) {
                  // Only fires if a "covers" attribute exists and is malformed;
                  // installations without one never call apply_config_() for
                  // it, so config_error() stays false here, never blocking.
                  id(connection_message) = "Smart Knob config JSON error";
                  return;
                }
                // Covers are intentionally excluded from this check: unlike
                // climates/lights, an installation that hasn't added a
                // "covers" attribute to its template sensor yet would
                // otherwise never leave this loading state, since HA never
                // pushes a value for an attribute the entity doesn't define.
                if (!id(ha_climates).config_loaded() || !id(ha_lights).config_loaded()) {
                  uint32_t connected_for = millis() - id(ha_connected_since_ms);
                  id(connection_message) = connected_for < 10000
                      ? "Smart Knob config loading..." : "Smart Knob config not found";
                  return;
                }
                if (id(ha_climates).empty()) {
                  id(connection_message) = "No climate configured";
                  return;
                }
                const auto &climate = id(ha_climates).get(id(climate_index));
                bool valid_climate = !climate.state.empty()
                    && climate.state != "unknown"
                    && climate.state != "unavailable";
                if (valid_climate) {
                  id(connection_ready) = true;
                  id(connection_message).clear();
                  return;
                }
                uint32_t connected_for = millis() - id(ha_connected_since_ms);
                id(connection_message) = connected_for < 10000
                    ? "Climate entity loading..." : "Climate entity not found";
          else:
            - lambda: |-
                id(connection_ready) = false;
                id(connection_message) = millis() < 30000
                    ? "WiFi connecting..." : "WiFi error";
      - lvgl.label.update:
          id: label_conn_thermo
          text: !lambda |-
            std::string conn_key = ha_connection_key(id(connection_message));
            return conn_key.empty() ? id(connection_message) : id(i18n_translations).translate(conn_key);
      - lvgl.label.update:
          id: label_conn_home
          text: !lambda |-
            std::string conn_key = ha_connection_key(id(connection_message));
            return conn_key.empty() ? id(connection_message) : id(i18n_translations).translate(conn_key);
      - lvgl.label.update:
          id: label_loading_status
          text: !lambda |-
            std::string conn_key = ha_connection_key(id(connection_message));
            return conn_key.empty() ? id(connection_message) : id(i18n_translations).translate(conn_key);
      - lvgl.label.update:
          id: label_loading_reboot_hint
          text: !lambda |-
            return id(i18n_translations).translate("reboot.hint");
      - if:
          condition:
            lambda: 'return id(connection_message) == "Smart Knob config not found";'
          then:
            - lvgl.widget.hide: spinner_ha_connection
            - lvgl.widget.show: icon_loading_config_error
            - lvgl.widget.show: button_loading_reboot_background
            - lvgl.widget.show: label_loading_reboot_hint
          else:
            - lvgl.widget.show: spinner_ha_connection
            - lvgl.widget.hide: icon_loading_config_error
            - lvgl.widget.hide: button_loading_reboot_background
            - lvgl.widget.hide: label_loading_reboot_hint
      - lambda: |-
          static bool previous_ready = false;
          id(connection_state_changed) = previous_ready != id(connection_ready);
          previous_ready = id(connection_ready);
      # Update all HA-backed text exactly once on a ready/not-ready transition.
      # In particular, do not restart the light-name marquee every two seconds.
      - if:
          condition:
            lambda: 'return id(connection_state_changed);'
          then:
            - script.execute: refresh_temps
            - script.execute: refresh_light
            - lambda: 'ESP_LOGI("diag", "connection_state_changed: connection_ready=%d ui_context=%d", id(connection_ready), id(ui_context));'
            # Never yank the screen away while the Setup Wizard is up - it
            # runs in the background regardless of ui_context, so Home
            # Assistant becoming reachable mid-wizard must not interrupt it.
            # wizard_finish is the only thing allowed to leave the wizard.
            - if:
                condition:
                  lambda: 'return id(ui_context) != 11;'
                then:
                  - if:
                      condition:
                        lambda: 'return id(connection_ready);'
                      then:
                        - lambda: 'id(ui_context) = 0;'
                        - lvgl.page.show:
                            id: screen_home
                            animation: NONE
                      else:
                        - lambda: 'id(ui_context) = -1;'
                        - lvgl.page.show:
                            id: screen_loading
                            animation: NONE
      - if:
          condition:
            lambda: 'return id(connection_ready);'
          then:
            - lvgl.widget.hide: label_conn_thermo
            - lvgl.widget.hide: label_conn_home
            - lvgl.widget.show: label_hvac_mode
            - lvgl.widget.show: label_home_hvac_mode
            - lvgl.widget.show: label_preset
            - lvgl.widget.show: label_home_preset
            - script.execute: refresh_status
          else:
            - lvgl.widget.show: label_conn_thermo
            - lvgl.widget.show: label_conn_home
            - lvgl.widget.hide: label_hvac_mode
            - lvgl.widget.hide: label_home_hvac_mode
            - lvgl.widget.hide: label_preset
            - lvgl.widget.hide: label_home_preset
            - lvgl.widget.hide: icon_mode_thermo
            - lvgl.widget.hide: icon_mode_home

  - id: open_settings
    then:
      - lambda: |-
          auto page_obj = [](esphome::lvgl::LvPageType *page) { return page->obj; };
          lv_obj_t *target = page_obj(screen_navigation);
          lv_obj_t *widgets[] = {
              id(label_settings_title), id(label_menu_icon_prev2), id(label_menu_icon_prev),
              id(label_menu_icon), id(label_menu_icon_next), id(label_menu_icon_next2),
              id(label_menu_prev2), id(label_menu_prev), id(label_menu_current),
              id(label_menu_next), id(label_menu_next2), id(label_menu_value)};
          for (lv_obj_t *widget : widgets)
            if (lv_obj_get_parent(widget) != target) lv_obj_set_parent(widget, target);
          // Remember which real screen we came from so "Back" returns there,
          // same as open_entity_overview. Entering from inside
          // screen_navigation itself (e.g. "Settings" in the entity list)
          // leaves the previously saved return screen untouched.
          if (id(ui_context) == 1) {
            id(entity_return_kind) = 1;
            id(entity_return_index) = id(climate_index);
          } else if (id(ui_context) == 5) {
            id(entity_return_kind) = 2;
            id(entity_return_index) = id(light_index);
          } else if (id(ui_context) == 7) {
            id(entity_return_kind) = 3;
            id(entity_return_index) = id(cover_index);
          } else if (id(ui_context) == 8) {
            id(entity_return_kind) = 4;
          } else if (id(ui_context) == 9) {
            id(entity_return_kind) = 5;
          } else if (id(ui_context) == 10) {
            id(entity_return_kind) = 6;
          }
          id(thermostat_quick_stage) = 0;
          id(ui_context) = 2;
          id(menu_index) = 0;
          id(group_item_index) = 0;
      - script.execute: update_settings_labels
      - lvgl.page.show:
          id: screen_navigation

  - id: group_enter
    then:
      - lambda: |-
          id(group_item_index) = 0;
          id(ui_context) = 3;
      - script.execute: update_settings_labels

  - id: menu_enter
    then:
      - lambda: |-
          id(submenu_type) = settings_group_type_at(id(menu_index), id(group_item_index));
          id(submenu_index) = 0;
          switch (id(submenu_type)) {
            case 0: {
              // Always lists every mode HA reports for this climate entity,
              // unfiltered.
              auto vec = ha_filter_modes(id(hvac_modes_raw));
              id(submenu_count) = (int) vec.size();
              for (size_t i = 0; i < vec.size(); i++)
                if (vec[i] == id(current_hvac_raw)) { id(submenu_index) = (int) i; break; }
              break;
            }
            case 1: {
              auto vec = ha_filter_presets(id(preset_modes_raw));
              id(submenu_count) = (int) vec.size();
              for (size_t i = 0; i < vec.size(); i++)
                if (vec[i] == id(current_preset_raw)) { id(submenu_index) = (int) i; break; }
              break;
            }
            case 2: break;
            case 3:  id(submenu_index) = id(time_24h).state ? 1 : 0; break;
            case 4:
              id(submenu_index) = id(language_select).current_option() == "Deutsch" ? 1 : 0;
              id(submenu_count) = 2;
              break;
            case 7:  id(submenu_index) = id(unit_select).current_option() == "Fahrenheit" ? 1 : 0; break;
            case 8:  id(num_preview) = (int) id(idle_home_num).state; break;
            case 9:  id(num_preview) = (int) id(dim_delay_num).state; break;
            case 10: id(num_preview) = (int) id(dim_level_num).state; break;
            case 13: {
              static const char *const opts[] = {"0.1", "0.2", "0.5", "1.0"};
              id(submenu_count) = 4;
              for (int i = 0; i < 4; i++)
                if (id(knob_step_select).current_option() == opts[i]) { id(submenu_index) = i; break; }
              break;
            }
            case 17: id(submenu_index) = id(led_enabled).state ? 1 : 0; break;
            case 18: id(num_preview) = (int) id(led_brightness_num).state; break;
            case 11: id(num_preview) = (int) id(timer_auto_home_num).state; break;
            case 19: id(submenu_index) = id(timer_finish_blink_switch).state ? 1 : 0; break;
            case 20: id(num_preview) = (int) id(progress_auto_home_num).state; break;
            case 22: id(num_preview) = (int) id(timer_knob_step_num).state; break;
            case 23: id(submenu_index) = id(timer_value_blink_switch).state ? 1 : 0; break;
            case 26: id(submenu_index) = id(timer_show_on_finish_switch).state ? 1 : 0; break;
            case 29: id(num_preview) = (int) id(timer_blink_led_brightness_num).state; break;
            case 30: id(num_preview) = (int) id(progress_blink_led_brightness_num).state; break;
            case 31: id(num_preview) = (int) id(notify_auto_home_num).state; break;
            case 34: id(num_preview) = (int) id(notify_blink_led_brightness_num).state; break;
            case 25: {
              id(submenu_count) = BLINK_LED_COLOR_COUNT;
              const std::string &cur_name = id(timer_blink_led_color_select).current_option();
              for (int i = 0; i < BLINK_LED_COLOR_COUNT; i++)
                if (cur_name == blink_led_color_name(i)) { id(submenu_index) = i; break; }
              break;
            }
            default: break;
          }
          id(ui_context) = 4;
      - script.execute: update_settings_labels

  - id: submenu_apply
    then:
      - lambda: |-
          id(apply_service) = 0;
          switch (id(submenu_type)) {
            case 0: {
              auto vec = ha_filter_modes(id(hvac_modes_raw));
              int n = (int) vec.size();
              if (n <= 0) break;
              int idx = ((id(submenu_index) % n) + n) % n;
              id(pending_mode_holder) = vec[idx];
              id(apply_service) = 1;
              break;
            }
            case 1: {
              auto vec = ha_filter_presets(id(preset_modes_raw));
              int n = (int) vec.size();
              if (n <= 0) break;
              int idx = ((id(submenu_index) % n) + n) % n;
              id(pending_mode_holder) = vec[idx];
              id(apply_service) = 2;
              break;
            }
            case 3:  id(apply_service) = id(submenu_index) ? 3 : 4; break;
            case 4:  id(apply_service) = id(submenu_index) ? 9 : 8; break;
            case 7:  id(apply_service) = id(submenu_index) ? 15 : 14; break;
            case 8:  id(apply_service) = 16; break;
            case 9:  id(apply_service) = 17; break;
            case 10: id(apply_service) = 18; break;
            case 13: {
              static const char *const opts[] = {"0.1", "0.2", "0.5", "1.0"};
              int idx = ((id(submenu_index) % 4) + 4) % 4;
              id(pending_mode_holder) = opts[idx];
              id(apply_service) = 21;
              break;
            }
            case 16: if (id(submenu_index) == 1) id(apply_service) = 7; break;
            case 17: id(apply_service) = id(submenu_index) ? 23 : 22; break;
            case 18: id(apply_service) = 24; break;
            case 11: id(apply_service) = 25; break;
            case 19: id(apply_service) = id(submenu_index) ? 26 : 27; break;
            case 20: id(apply_service) = 28; break;
            case 22: id(apply_service) = 31; break;
            case 23: id(apply_service) = id(submenu_index) ? 32 : 33; break;
            case 25:
              id(pending_mode_holder) = blink_led_color_name(id(submenu_index));
              id(apply_service) = 36;
              break;
            case 26: id(apply_service) = id(submenu_index) ? 37 : 38; break;
            case 29: id(apply_service) = 41; break;
            case 30: id(apply_service) = 42; break;
            case 31: id(apply_service) = 44; break;
            case 34: id(apply_service) = 48; break;
            default: break;
          }
          id(ui_context) = id(thermostat_quick_stage) != 0 ? 1 : 3;
      - if:
          condition: {lambda: 'return id(apply_service) == 1;'}
          then:
            - homeassistant.service:
                service: climate.set_hvac_mode
                data:
                  entity_id: !lambda 'return id(ha_climates).get(id(climate_index)).entity_id;'
                  hvac_mode: !lambda 'return id(pending_mode_holder);'
      - if:
          condition: {lambda: 'return id(apply_service) == 2;'}
          then:
            - homeassistant.service:
                service: climate.set_preset_mode
                data:
                  entity_id: !lambda 'return id(ha_climates).get(id(climate_index)).entity_id;'
                  preset_mode: !lambda 'return id(pending_mode_holder);'
      - if:
          condition: {lambda: 'return id(apply_service) == 3;'}
          then: [switch.turn_on: time_24h]
      - if:
          condition: {lambda: 'return id(apply_service) == 4;'}
          then: [switch.turn_off: time_24h]
      - if:
          condition: {lambda: 'return id(apply_service) == 7;'}
          then: [button.press: factory_reset_btn]
      - if:
          condition: {lambda: 'return id(apply_service) == 8;'}
          then: [{select.set: {id: language_select, option: "English"}}]
      - if:
          condition: {lambda: 'return id(apply_service) == 9;'}
          then: [{select.set: {id: language_select, option: "Deutsch"}}]
      - if:
          condition: {lambda: 'return id(apply_service) == 14;'}
          then: [{select.set: {id: unit_select, option: "Celsius"}}]
      - if:
          condition: {lambda: 'return id(apply_service) == 15;'}
          then: [{select.set: {id: unit_select, option: "Fahrenheit"}}]
      - if:
          condition: {lambda: 'return id(apply_service) == 16;'}
          then: [{number.set: {id: idle_home_num, value: !lambda 'return id(num_preview);'}}]
      - if:
          condition: {lambda: 'return id(apply_service) == 17;'}
          then: [{number.set: {id: dim_delay_num, value: !lambda 'return id(num_preview);'}}]
      - if:
          condition: {lambda: 'return id(apply_service) == 18;'}
          then: [{number.set: {id: dim_level_num, value: !lambda 'return id(num_preview);'}}]
      - if:
          condition: {lambda: 'return id(apply_service) == 21;'}
          then:
            - select.set:
                id: knob_step_select
                option: !lambda 'return id(pending_mode_holder);'
      - if:
          condition: {lambda: 'return id(apply_service) == 22;'}
          then: [switch.turn_off: led_enabled]
      - if:
          condition: {lambda: 'return id(apply_service) == 23;'}
          then: [switch.turn_on: led_enabled]
      - if:
          condition: {lambda: 'return id(apply_service) == 24;'}
          then: [{number.set: {id: led_brightness_num, value: !lambda 'return id(num_preview);'}}]
      - if:
          condition: {lambda: 'return id(apply_service) == 25;'}
          then: [{number.set: {id: timer_auto_home_num, value: !lambda 'return id(num_preview);'}}]
      - if:
          condition: {lambda: 'return id(apply_service) == 26;'}
          then: [switch.turn_on: timer_finish_blink_switch]
      - if:
          condition: {lambda: 'return id(apply_service) == 27;'}
          then: [switch.turn_off: timer_finish_blink_switch]
      - if:
          condition: {lambda: 'return id(apply_service) == 28;'}
          then: [{number.set: {id: progress_auto_home_num, value: !lambda 'return id(num_preview);'}}]
      - if:
          condition: {lambda: 'return id(apply_service) == 31;'}
          then: [{number.set: {id: timer_knob_step_num, value: !lambda 'return id(num_preview);'}}]
      - if:
          condition: {lambda: 'return id(apply_service) == 32;'}
          then: [switch.turn_on: timer_value_blink_switch]
      - if:
          condition: {lambda: 'return id(apply_service) == 33;'}
          then: [switch.turn_off: timer_value_blink_switch]
      - if:
          condition: {lambda: 'return id(apply_service) == 36;'}
          then:
            - select.set:
                id: timer_blink_led_color_select
                option: !lambda 'return id(pending_mode_holder);'
      - if:
          condition: {lambda: 'return id(apply_service) == 37;'}
          then: [switch.turn_on: timer_show_on_finish_switch]
      - if:
          condition: {lambda: 'return id(apply_service) == 38;'}
          then: [switch.turn_off: timer_show_on_finish_switch]
      - if:
          condition: {lambda: 'return id(apply_service) == 41;'}
          then: [{number.set: {id: timer_blink_led_brightness_num, value: !lambda 'return id(num_preview);'}}]
      - if:
          condition: {lambda: 'return id(apply_service) == 42;'}
          then: [{number.set: {id: progress_blink_led_brightness_num, value: !lambda 'return id(num_preview);'}}]
      - if:
          condition: {lambda: 'return id(apply_service) == 44;'}
          then: [{number.set: {id: notify_auto_home_num, value: !lambda 'return id(num_preview);'}}]
      - if:
          condition: {lambda: 'return id(apply_service) == 48;'}
          then: [{number.set: {id: notify_blink_led_brightness_num, value: !lambda 'return id(num_preview);'}}]
      - if:
          condition:
            lambda: 'return id(thermostat_quick_stage) != 0;'
          then:
            - lambda: 'id(thermostat_quick_stage) = 0;'
            - script.execute: load_active_climate
            - lvgl.page.show:
                id: screen_thermostat
                animation: NONE
          else:
            - script.execute: update_settings_labels

  - id: update_settings_labels
    then:
      - lambda: |-
          char buf[64];
          if (id(ui_context) == 6) {
            int climates = (int) id(ha_climates).size();
            int lights = (int) id(ha_lights).size();
            int covers = (int) id(ha_covers).size();
            int timers = !parse_timer_queue(id(timer_queue)).empty() ? 1 : 0;
            int progresses = !parse_progress_queue(id(progress_queue)).empty() ? 1 : 0;
            int notifies = id(notify_finished) ? 1 : 0;
            int count = climates + lights + covers + timers + progresses + notifies + 2;
            ESP_LOGI("diag", "entity menu: climates=%d lights=%d covers=%d timers=%d progresses=%d notifies=%d count=%d idx=%d timer_queue_raw='%s'",
                     climates, lights, covers, timers, progresses, notifies, count,
                     id(entity_menu_index), id(timer_queue).c_str());
            // Order is Progress, Notify, Timer, Settings, Back - see
            // entity_menu_enter for why Timer sits right before Settings.
            auto entity_name = [climates, lights, covers, timers, progresses, notifies,
                                 count](int p) -> std::string {
              p = ((p % count) + count) % count;
              if (p < climates) return id(ha_climates).get(p).name;
              if (p < climates + lights) return id(ha_lights).get(p - climates).name;
              if (p < climates + lights + covers) return id(ha_covers).get(p - climates - lights).name;
              if (p < climates + lights + covers + progresses)
                return id(i18n_translations).translate("settings.group.progress");
              if (p < climates + lights + covers + progresses + notifies)
                return id(i18n_translations).translate("settings.group.notify");
              if (p < climates + lights + covers + progresses + notifies + timers)
                return id(i18n_translations).translate("settings.group.timer");
              return p == climates + lights + covers + progresses + notifies + timers
                         ? id(i18n_translations).translate("common.settings")
                         : id(i18n_translations).translate("common.back");
            };
            auto m = menu_window(id(entity_menu_index), count, ${settings_extra_rows}, entity_name);
            id(set_title) = id(i18n_translations).translate("common.entities");
            id(set_prev2) = m.prev2;
            id(set_prev) = m.prev;
            id(set_cur) = m.cur;
            id(set_next) = m.next;
            id(set_next2) = m.next2;
            id(set_value) = m.value;
          } else if (id(ui_context) == 2) {
            auto m = menu_window(id(menu_index), SETTINGS_ROOT_COUNT, ${settings_extra_rows},
                                  [](int p) -> std::string {
                                    return id(i18n_translations).translate(settings_root_name(p));
                                  });
            id(set_title) = id(i18n_translations).translate("common.settings");
            id(set_prev2) = m.prev2;
            id(set_prev) = m.prev;
            id(set_cur) = m.cur;
            id(set_next) = m.next;
            id(set_next2) = m.next2;
            id(set_value) = m.value;
          } else if (id(ui_context) == 3) {
            int group = settings_group_wrap(id(menu_index));
            int count = settings_group_entry_count(group);
            int i = ((id(group_item_index) % count) + count) % count;
            int t = settings_group_entry_type_at(group, i);
            auto entry_name = [group](int position) -> std::string {
              int type = settings_group_entry_type_at(group, position);
              if (type < 0) return id(i18n_translations).translate("common.back");
              const char *key = settings_menu_name(type);
              return key[0] ? id(i18n_translations).translate(key) : std::string("-");
            };
            auto m = menu_window(id(group_item_index), count, ${settings_extra_rows}, entry_name);
            id(set_title) = id(i18n_translations).translate(SETTINGS_GROUP_KEYS[group]);
            id(set_prev2) = m.prev2;
            id(set_prev) = m.prev;
            id(set_cur) = m.cur;
            id(set_next) = m.next;
            id(set_next2) = m.next2;
            id(set_value) = m.value;
            std::string val;
            switch (t) {
              case 0: {
                std::string key = ha_hvac_mode_key(id(current_hvac_raw));
                val = key.empty() ? "-" : id(i18n_translations).translate(key);
                break;
              }
              case 1: {
                std::string key = ha_preset_key(id(current_preset_raw));
                val = !key.empty() ? id(i18n_translations).translate(key)
                                    : (id(current_preset_raw).empty() ? std::string("-") : id(current_preset_raw));
                break;
              }
              case 2: snprintf(buf, sizeof(buf), "%d%%", id(brightness_pct)); val = buf; break;
              case 3:
                val = id(i18n_translations).translate(
                    id(time_24h).state ? "common.clock_24h" : "common.clock_12h");
                break;
              case 4: val = id(language_select).current_option(); break;
              case 7: val = id(unit_select).current_option() == "Fahrenheit" ? "°F" : "°C"; break;
              case 8: snprintf(buf, sizeof(buf), "%ds", (int) id(idle_home_num).state); val = buf; break;
              case 9: snprintf(buf, sizeof(buf), "%ds", (int) id(dim_delay_num).state); val = buf; break;
              case 10: snprintf(buf, sizeof(buf), "%d%%", (int) id(dim_level_num).state); val = buf; break;
              case 13: val = id(knob_step_select).current_option().str() + "°C"; break;
              case 14: val = id(wifi_ssid_txt).state; break;
              case 15: val = id(fw_version).state; break;
              case 16: val = ""; break;
              case 17:
                val = id(i18n_translations).translate(id(led_enabled).state ? "common.on" : "common.off");
                break;
              case 18: snprintf(buf, sizeof(buf), "%d%%", (int) id(led_brightness_num).state); val = buf; break;
              case 11: {
                int v = (int) id(timer_auto_home_num).state;
                if (v <= 0) { val = id(i18n_translations).translate("common.off"); }
                else { snprintf(buf, sizeof(buf), "%ds", v); val = buf; }
                break;
              }
              case 19:
                val = id(i18n_translations).translate(
                    id(timer_finish_blink_switch).state ? "common.on" : "common.off");
                break;
              case 20: {
                int v = (int) id(progress_auto_home_num).state;
                if (v <= 0) { val = id(i18n_translations).translate("common.off"); }
                else { snprintf(buf, sizeof(buf), "%ds", v); val = buf; }
                break;
              }
              case 22: snprintf(buf, sizeof(buf), "%ds", (int) id(timer_knob_step_num).state); val = buf; break;
              case 23:
                val = id(i18n_translations).translate(
                    id(timer_value_blink_switch).state ? "common.on" : "common.off");
                break;
              case 25:
                val = id(i18n_translations).translate(
                    blink_led_color_key_for_name(id(timer_blink_led_color_select).current_option()));
                break;
              case 26:
                val = id(i18n_translations).translate(
                    id(timer_show_on_finish_switch).state ? "common.on" : "common.off");
                break;
              case 29: snprintf(buf, sizeof(buf), "%d%%", (int) id(timer_blink_led_brightness_num).state); val = buf; break;
              case 30: snprintf(buf, sizeof(buf), "%d%%", (int) id(progress_blink_led_brightness_num).state); val = buf; break;
              case 31: {
                int v = (int) id(notify_auto_home_num).state;
                if (v <= 0) { val = id(i18n_translations).translate("common.off"); }
                else { snprintf(buf, sizeof(buf), "%ds", v); val = buf; }
                break;
              }
              case 34: snprintf(buf, sizeof(buf), "%d%%", (int) id(notify_blink_led_brightness_num).state); val = buf; break;
            }
            (void) val;
          } else {
            int t = id(submenu_type);
            {
              const char *title_key = settings_menu_name(t);
              id(set_title) = title_key[0] ? id(i18n_translations).translate(title_key) : std::string("-");
            }
            int group = settings_group_wrap(id(menu_index));
            int gcount = settings_group_entry_count(group);
            auto entry_name = [group](int position) -> std::string {
              int type = settings_group_entry_type_at(group, position);
              if (type < 0) return id(i18n_translations).translate("common.back");
              const char *key = settings_menu_name(type);
              return key[0] ? id(i18n_translations).translate(key) : std::string("-");
            };
            auto gm = menu_window(id(group_item_index), gcount, ${settings_extra_rows}, entry_name);
            id(set_prev2) = gm.prev2;
            id(set_prev) = gm.prev;
            id(set_next) = gm.next;
            id(set_next2) = gm.next2;
            // Every case below overrides prev/cur/next with its own option
            // list (HA entity list, fixed choices, Off/On, or the number's
            // own step range) and val with that list's "i / n" position -
            // same scroll pattern everywhere, just over different lists.
            // Only case 14/15 (read-only WiFi/firmware info) have nothing to
            // scroll through and keep the group-sibling prev/next from above.
            std::string cur, val = gm.value;
            switch (t) {
              case 0:
              case 1: {
                std::vector<std::string> vec;
                if (t == 0) {
                  vec = ha_filter_modes(id(hvac_modes_raw));
