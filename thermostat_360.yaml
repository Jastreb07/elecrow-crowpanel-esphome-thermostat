# ------------------------------------------------------------------
# Status LED, WS2812 strip according to Elecrow docs: LED_PIN=48, LED_NUM=5.
# It glows blue-white outside idle mode and turns off while dimmed.
# ------------------------------------------------------------------
light:
  - platform: esp32_rmt_led_strip
    id: status_led
    name: "Status LED"
    internal: true
    pin: GPIO48
    num_leds: 5
    channel_colors: GRB
    chipset: WS2812
    default_transition_length: 0s

script:
  - id: !extend update_status_led
    then:
      - if:
          # Do not touch the LED before on_boot(-100) is complete. Restored
          # select values can trigger refresh_status before RMT/WS2812 setup.
          condition:
            lambda: 'return !id(app_booted);'
          then: []
          else:
            # Timer/Progress/Notify finish LED takes priority over the normal
            # HVAC-color display - it's a deliberate alert, so it ignores
            # led_enabled/display_dimmed the same way the old forced-
            # backlight blink used to. Only while still on the respective
            # screen - leaving it (even with the entry still finished) stops
            # the effect. All three read led_mode (0 off/1 on-solid/2 blink)
            # and color from whichever queue entry is currently displayed -
            # there is no separate global switch/select for any of them.
            - if:
                condition:
                  lambda: |-
                    return current_screen_led_mode(id(ui_context), id(timer_queue), id(timer_queue_index),
                                                     id(progress_queue), id(progress_queue_index),
                                                     id(notify_queue), id(notify_queue_index),
                                                     id(notify_finished), id(ha_time).now()) == 2;
                then:
                  - if:
                      condition:
                        lambda: 'return id(blink_led_on);'
                      then:
                        - light.turn_on:
                            id: status_led
                            brightness: !lambda |-
                                if (id(ui_context) == 8) return id(timer_blink_led_brightness_num).state / 100.0f;
                                if (id(ui_context) == 9) return id(progress_blink_led_brightness_num).state / 100.0f;
                                return id(notify_blink_led_brightness_num).state / 100.0f;
                            red: !lambda |-
                                return current_screen_led_color(id(ui_context), id(timer_queue), id(timer_queue_index),
                                                                 id(progress_queue), id(progress_queue_index),
                                                                 id(notify_queue), id(notify_queue_index)).r;
                            green: !lambda |-
                                return current_screen_led_color(id(ui_context), id(timer_queue), id(timer_queue_index),
                                                                 id(progress_queue), id(progress_queue_index),
                                                                 id(notify_queue), id(notify_queue_index)).g;
                            blue: !lambda |-
                                return current_screen_led_color(id(ui_context), id(timer_queue), id(timer_queue_index),
                                                                 id(progress_queue), id(progress_queue_index),
                                                                 id(notify_queue), id(notify_queue_index)).b;
                      else:
                        - light.turn_off: status_led
                else:
                  - if:
                      # "On" (solid, not blinking) mode.
                      condition:
                        lambda: |-
                          return current_screen_led_mode(id(ui_context), id(timer_queue), id(timer_queue_index),
                                                          id(progress_queue), id(progress_queue_index),
                                                          id(notify_queue), id(notify_queue_index),
                                                          id(notify_finished), id(ha_time).now()) == 1;
                      then:
                        - light.turn_on:
                            id: status_led
                            brightness: !lambda |-
                                if (id(ui_context) == 8) return id(timer_blink_led_brightness_num).state / 100.0f;
                                if (id(ui_context) == 9) return id(progress_blink_led_brightness_num).state / 100.0f;
                                return id(notify_blink_led_brightness_num).state / 100.0f;
                            red: !lambda |-
                                return current_screen_led_color(id(ui_context), id(timer_queue), id(timer_queue_index),
                                                                 id(progress_queue), id(progress_queue_index),
                                                                 id(notify_queue), id(notify_queue_index)).r;
                            green: !lambda |-
                                return current_screen_led_color(id(ui_context), id(timer_queue), id(timer_queue_index),
                                                                 id(progress_queue), id(progress_queue_index),
                                                                 id(notify_queue), id(notify_queue_index)).g;
                            blue: !lambda |-
                                return current_screen_led_color(id(ui_context), id(timer_queue), id(timer_queue_index),
                                                                 id(progress_queue), id(progress_queue_index),
                                                                 id(notify_queue), id(notify_queue_index)).b;
                      else:
                        - if:
                            condition:
                              lambda: 'return id(display_dimmed) || !id(led_enabled).state;'
                            then:
                              - light.turn_off: status_led
                            else:
                              - light.turn_on:
                                  id: status_led
                                  brightness: !lambda 'return id(led_brightness_num).state / 100.0f;'
                                  red: !lambda |-
                                      bool dual = !std::isnan(id(target_low_v)) && !std::isnan(id(target_high_v));
                                      return hvac_led_color(id(current_hvac_raw), dual, id(adjust_target)).r;
                                  green: !lambda |-
                                      bool dual = !std::isnan(id(target_low_v)) && !std::isnan(id(target_high_v));
                                      return hvac_led_color(id(current_hvac_raw), dual, id(adjust_target)).g;
                                  blue: !lambda |-
                                      bool dual = !std::isnan(id(target_low_v)) && !std::isnan(id(target_high_v));
                                      return hvac_led_color(id(current_hvac_raw), dual, id(adjust_target)).b;

  - id: !extend preview_led_brightness
    then:
      - if:
          condition:
            lambda: 'return id(app_booted);'
          then:
            - light.turn_on:
                id: status_led
                brightness: !lambda 'return id(num_preview) / 100.0f;'
                red: !lambda |-
                    bool dual = !std::isnan(id(target_low_v)) && !std::isnan(id(target_high_v));
                    return hvac_led_color(id(current_hvac_raw), dual, id(adjust_target)).r;
                green: !lambda |-
                    bool dual = !std::isnan(id(target_low_v)) && !std::isnan(id(target_high_v));
                    return hvac_led_color(id(current_hvac_raw), dual, id(adjust_target)).g;
                blue: !lambda |-
                    bool dual = !std::isnan(id(target_low_v)) && !std::isnan(id(target_high_v));
                    return hvac_led_color(id(current_hvac_raw), dual, id(adjust_target)).b;
