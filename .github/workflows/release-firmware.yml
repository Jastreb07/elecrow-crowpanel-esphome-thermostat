name: Release firmware

# See docs/GITHUB_RELEASES_PLAN.md for the full design/reasoning. Trigger:
# every push to master, but the workflow stops immediately with a failure if
# firmware/version.txt names a version that already has a release. The failed
# run also triggers GitHub's configured Actions email notifications.
on:
  push:
    branches: [master]
  workflow_dispatch: {} # for testing without a real push, see the plan doc

permissions:
  contents: write # to create the release + upload assets

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        shell: bash
        run: |
          version="$(cat firmware/version.txt)"
          version="${version//$'\xEF\xBB\xBF'/}"
          version="$(printf '%s' "$version" | xargs)"

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error title=Invalid firmware version::firmware/version.txt must contain a valid version such as 1.0.1."
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Abort if this version was already released
        uses: actions/github-script@v7
        env:
          FIRMWARE_VERSION: ${{ steps.version.outputs.version }}
        with:
          script: |
            const normalizeVersion = (value) =>
              value.replace(/\uFEFF/g, '').trim().replace(/^v/i, '');
            const version = normalizeVersion(process.env.FIRMWARE_VERSION);
            const tag = `v${version}`;

            const releases = await github.paginate(
              github.rest.repos.listReleases,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100,
              }
            );
            const existingRelease = releases.find(
              (release) => normalizeVersion(release.tag_name) === version
            );

            if (existingRelease) {
              core.setFailed(
                `Firmware version ${version} already exists as GitHub release ` +
                `${existingRelease.tag_name}. Increase firmware/version.txt before ` +
                `merging to master.`
              );
            } else {
              core.info(`No release found for ${tag}; continuing with the build.`);
            }

      # secrets.yaml is gitignored (never committed) - !secret values are
      # only resolved at compile time. wifi_*/wifi_ap_password are never
      # actually used by the shipped firmware (Wi-Fi is configured after
      # flashing via Improv Serial); ota_password protects the *local*
      # network ota:-platform-esphome debug receiver, not the self-update
      # mechanism, so it comes from a real repo secret rather than a
      # public placeholder.
      - name: Write secrets.yaml
        run: |
          cat > secrets.yaml <<EOF
          wifi_ssid: "placeholder"
          wifi_password: "placeholder"
          wifi_ap_password: "placeholder"
          ota_password: "${{ secrets.OTA_PASSWORD }}"
          EOF

      # firmware_version drives the esphome: project: version: block, which
      # is what update:'s current_version reports after flashing - without
      # this override it would stay pinned to the "0.0.0-dev" local-build
      # placeholder, and current_version would never match a real release's
      # latest_version, so the device would keep reporting the same update
      # as available forever, even right after successfully installing it.
      - name: Build thermostat_240
        id: build-240
        uses: esphome/build-action@v7.0.0
        with:
          yaml-file: thermostat_240.yaml
          version: latest
          complete-manifest: true
          release-summary: "Smart Thermostat Knob ${{ steps.version.outputs.version }}"
          release-url: "https://github.com/${{ github.repository }}/releases/tag/v${{ steps.version.outputs.version }}"
          substitutions: |
            firmware_version=${{ steps.version.outputs.version }}

      - name: Build thermostat_480
        id: build-480
        uses: esphome/build-action@v7.0.0
        with:
          yaml-file: thermostat_480.yaml
          version: latest
          complete-manifest: true
          release-summary: "Smart Thermostat Knob ${{ steps.version.outputs.version }}"
          release-url: "https://github.com/${{ github.repository }}/releases/tag/v${{ steps.version.outputs.version }}"
          substitutions: |
            firmware_version=${{ steps.version.outputs.version }}

      # Renames both boards' outputs with their release_asset_board prefix
      # (thermostat_240-/thermostat_480-, matching the substitution of the
      # same name in the board YAMLs), computes SHA256 checksums for all
      # four .bin files, adjusts the complete ESP Web Tools manifest generated
      # by build-action to use the final release factory-binary URL and the
      # project's Improv settings, and
      # generates ota-manifest.json (ESPHome's update:-component schema,
      # which build-action does not produce) with a freshly computed MD5.
      - name: Assemble release assets
        run: |
          set -euo pipefail
          mkdir -p release-assets
          repo_base="https://github.com/${{ github.repository }}/releases/latest/download"
          version="${{ steps.version.outputs.version }}"

          assemble_board() {
            local build_dir="$1" asset_board="$2" display_name="$3"

            cp "$build_dir"/*.factory.bin "release-assets/${asset_board}-firmware.factory.bin"
            cp "$build_dir"/*.ota.bin "release-assets/${asset_board}-firmware.ota.bin"

            # .name drives the esp-web-tools install dialog's title (see
            # install-dialog.ts's _renderDashboard(), heading = manifest.name)
            # - without this override it stays whatever build-action filled
            # in (the ESPHome project id, e.g. "jastreb07.thermostat_knob"),
            # which is meant to be a machine-readable namespaced identifier
            # (esphome/core/config.py's valid_project_name only requires
            # exactly one "."), not a user-facing label.
            jq --arg url "${repo_base}/${asset_board}-firmware.factory.bin" \
               --arg name "${display_name} v${version}" \
              '
                .name = $name
                | .new_install_prompt_erase = true
                | .new_install_improv_wait_time = 30
                | .builds[].improv = true
                | .builds[].parts[].path = $url
              ' \
              "$build_dir/manifest.json" > "release-assets/${asset_board}-manifest.json"

            local md5
            md5=$(md5sum "release-assets/${asset_board}-firmware.ota.bin" | cut -d' ' -f1)
            jq -n \
              --arg name "$display_name" \
              --arg version "$version" \
              --arg path "${repo_base}/${asset_board}-firmware.ota.bin" \
              --arg md5 "$md5" \
              '{name: $name, version: $version, builds: [{chipFamily: "ESP32-S3", ota: {path: $path, md5: $md5}}]}' \
              > "release-assets/${asset_board}-ota-manifest.json"
          }

          assemble_board "${{ steps.build-240.outputs.name }}" "thermostat_240" "Smart Thermostat Knob (CrowPanel 1.28\" 240x240)"
          assemble_board "${{ steps.build-480.outputs.name }}" "thermostat_480" "Smart Thermostat Knob (CrowPanel 2.1\" 480x480)"

          (cd release-assets && sha256sum ./*.bin > checksums.txt)

      - name: Extract release notes from CHANGELOG.md
        run: |
          set -euo pipefail
          awk -v ver="${{ steps.version.outputs.version }}" '
            BEGIN { found = 0 }
            /^## / {
              if (found) exit
              if ($0 == "## " ver) { found = 1; next }
              next
            }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "Smart Thermostat Knob ${{ steps.version.outputs.version }}" > release-notes.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.version.outputs.version }}"
          name: "v${{ steps.version.outputs.version }}"
          body_path: release-notes.md
          files: release-assets/*
