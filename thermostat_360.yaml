########################################################################
# thermostat_360.yaml
#
# Board variant: CrowPanel 1.46" HMI ESP32-S3 rotary display, 360x360.
# JD9866 SPI panel with the ili9xxx driver, CST816 touch, and direct GPIOs
# without a PCF8574 expander. Pin values are based on the official Elecrow
# example. Shared behavior comes from thermostat_common.yaml.
########################################################################

packages:
  common: !include thermostat_common.yaml

# Use a board-specific base name so switching variants does not reuse the same
# PlatformIO build directory. MAC suffixes remain enabled in thermostat_common.
substitutions:
  device_name: thermostat360
  # GitHub Release asset filename prefix for this board (e.g.
  # thermostat_360-ota-manifest.json) - see docs/GITHUB_RELEASES_PLAN.md.
  # Kept separate from device_name (no underscore) since that's used
  # elsewhere for the mDNS/API device name.
  release_asset_board: thermostat_360
  settings_row_gap: "72"
  light_color_preset_border: "5"
  light_slider_range: "174"
  light_kelvin_scale_width: "216"
  light_kelvin_scale_height: "48"
  cover_fill_max: "360"
  cover_knob_margin: "24"

esphome:
  on_boot:
    - priority: 800
      then:
        - output.turn_off: power_light
        - output.turn_on: out1
        - output.turn_on: out2

# ------------------------------------------------------------------
# I2C (Touch)
# ------------------------------------------------------------------
i2c:
  sda: GPIO6
  scl: GPIO7
  id: bus_a
  scan: true
  frequency: 400kHz

output:
  - platform: ledc
    pin: 
      number: GPIO46    # Note: GPIO46 can trigger strapping warnings
      ignore_strapping_warning: true
    id: bl_pwm
    frequency: 19531Hz
  - platform: gpio
    id: power_light
    pin: GPIO40
  - platform: gpio
    id: out1
    pin: GPIO1
  - platform: gpio
    id: out2
    pin: GPIO2

# ------------------------------------------------------------------
# Display / touch, based on the Elecrow 1.28" reference.
# ------------------------------------------------------------------
spi:
  id: spi_bus
  mosi_pin: GPIO11
  clk_pin: GPIO10

touchscreen:
  platform: cst816
  id: my_touchscreen
  i2c_id: bus_a
  address: 0x15
  interrupt_pin: GPIO5
  reset_pin: GPIO13
  transform:
    mirror_x: false
    mirror_y: true
    swap_xy: true
  on_touch:
    - script.execute: wake_display

display:
  - platform: mipi_spi              # replaces deprectaed ILI9XXX display driver 
    id: my_display                  # Display ID
    model: CUSTOM                   # Custom display model
    cs_pin: GPIO9                   # SPI chip select pin
    dc_pin:                         # Data/command pin 
      number: GPIO3                 # Note: GPIO3 can trigger strapping warnings
      ignore_strapping_warning: true
    reset_pin: GPIO14               # Display reset pin
    dimensions:
      width: 360                    # Screen width (px)
      height: 360                   # Screen height (px)
      offset_height: 0              # Vertical offset
    data_rate: 40MHz                # SPI communication speed
    color_order: RGB                # RGB color order
    invert_colors: false            # No color inversion
    init_sequence:                  # Display initialization commands
      - [0xDE, 0x00]
      - [0xDF, 0x98, 0x55]
      - [0xB2, 0x1F]
      - [0xB7, 0x00, 0x1D, 0x00, 0x45]
      - [0xBB, 0x1B, 0x64, 0xC4, 0x1E, 0x3E, 0xF5]
      - [0xBC, 0x03, 0x20, 0xF3, 0xC0]
      - [0xC0, 0x22, 0xA1]
      - [0xC3, 0x00, 0x02, 0x2A, 0x0B, 0x08, 0x48, 0x08, 0x04, 0x62, 0x30, 0x30]
      - [0xC4, 0x40, 0x00, 0xAD, 0x68, 0x43, 0x07, 0x04, 0x16, 0x43, 0x07, 0x04]
      - [0xD3, 0x28, 0x13]
      - [0xD9, 0x00, 0x00, 0xFF, 0x00, 0xF0, 0x00]
      - [0xDE, 0x01]
      - [0xB7, 0x13, 0xE7, 0x64, 0x39, 0x06, 0x36, 0x19, 0x1C]
      - [0xBE, 0x00]
      - [0xC1, 0x00, 0x4A, 0x80]
      - [0xC2, 0x00, 0x16, 0xDA, 0xE7]
      - [0xC7, 0x00, 0x00, 0x00, 0x38, 0x08, 0x08, 0x00, 0x01]
      - [0xC8, 0x00, 0x00, 0x00, 0x00, 0x15, 0x3B]
      - [0xC9, 0x00, 0x16, 0x06, 0x04, 0x0A]
      - [0xCA, 0x08, 0x35, 0x16, 0x1F, 0x1F]
      - [0xCB, 0x01, 0x16, 0x07, 0x05, 0x0B]
      - [0xCC, 0x09, 0x35, 0x16, 0x1F, 0x1F]
      - [0xCD, 0x01, 0x16, 0x09, 0x0B, 0x05]
      - [0xCE, 0x07, 0x15, 0x1F, 0x16, 0x1F]
      - [0xCF, 0x00, 0x16, 0x08, 0x0A, 0x04]
      - [0xD0, 0x06, 0x15, 0x1F, 0x16, 0x1F]
      - [0xD1, 0x02, 0x30]
      - [0xD2, 0x02, 0x03, 0x52, 0xDF, 0xDD]
      - [0xD3, 0x3B, 0x04, 0x48]
      - [0xD5, 0x10, 0x10, 0x07, 0x07, 0x0F, 0x94, 0x26]
      - [0xD6, 0x00, 0x00, 0x40]
      - [0xD7, 0x00, 0x00, 0x20]
      - [0xDE, 0x02]
      - [0xB6, 0x1C]
      - [0xDE, 0x00]
      - [0x4D, 0x00]
      - [0x4E, 0x00]
      - [0x4F, 0x00]
      - [0x4C, 0x01]
      - [0x4C, 0x00]
      - [0x36, 0x00]
      - [0x35]
      - [0x2A, 0x00, 0x00, 0x01, 0x67]
      - [0x2B, 0x00, 0x00, 0x01, 0x67]
      - [0x11,120]
      - [0x29,20]

# ------------------------------------------------------------------
# Encoder pins and button: this board uses direct GPIOs instead of the PCF8574.
# Override the defaults from thermostat_common.yaml with !extend.
# ------------------------------------------------------------------
binary_sensor:
  # Direct GPIO button without PCF8574 hardware debounce. Add an extra debounce
  # filter so button bounce does not break the on_multi_click timing window.
  - id: !extend encoder_button
    pin:
      pcf8574: !remove
      number: GPIO41
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on_off: 30ms

sensor:
  - id: !extend temperature_encoder
    resolution: 2
    pin_a:
      number: GPIO45 # Note: GPIO45 can trigger strapping warnings
      ignore_strapping_warning: true
      mode:
        input: true
        pullup: true
    pin_b:
      number: GPIO42
      mode:
        input: true
        pullup: true

# ------------------------------------------------------------------
# LVGL – 3 Screens
# ------------------------------------------------------------------
lvgl:
  # LVGL invalidates and redraws changed regions itself. Periodic full display
  # updates make page transitions noticeably less fluid.
  buffer_size: 12%
  displays:
    - my_display
  touchscreens:
    - my_touchscreen
  bg_color: "0x000000"
  default_font: rajdhani_medium_20
  scrollable: false
  scrollbar_mode: "OFF"

  on_idle:
    - timeout: !lambda 'return (uint32_t)(id(dim_delay_num).state * 1000.0f);'
      then:
        - lambda: 'id(display_dimmed) = true;'
        - light.turn_on:
            id: display_backlight
            brightness: !lambda 'return id(dim_level_num).state / 100.0f;'
        - script.execute: update_status_led
    - timeout: !lambda 'return (uint32_t)(id(idle_home_num).state * 1000.0f);'
      then:
        - if:
            condition:
              lambda: |-
                return id(connection_ready) && id(ui_context) != 8 && id(ui_context) != 9 &&
                       id(ui_context) != 10 && id(ui_context) != 11;
            then:
              - lambda: 'id(ui_context) = 0;'
              - script.execute: refresh_temps
              - script.execute: refresh_status
              - lvgl.page.show: screen_home

  pages:
    # ================= Home Assistant loading =================
    - id: screen_loading
      bg_color: "0x000000"
      widgets:
        - button:
            id: button_loading_reboot_background
            align: CENTER
            width: 360
            height: 360
            radius: 0
            bg_opa: TRANSP
            border_width: 0
            shadow_width: 0
            hidden: true
            on_click:
              - button.press: restart_btn
        - spinner:
            id: spinner_ha_connection
            align: CENTER
            width: 114
            height: 114
            spin_time: 900ms
            arc_length: 80deg
            arc_color: 0x444444
            arc_width: 10
            indicator:
              arc_color: 0xFFFFFF
              arc_width: 10
        - label:
            id: icon_loading_config_error
            text: "󰗖"
            text_font: icons_alert_120
            text_color: 0xFFFFFF
            align: CENTER
            hidden: true
        - label:
            id: label_loading_reboot_hint
            text: "Press knob or touch\ndisplay to reboot"
            text_font: rajdhani_medium_20
            text_color: 0xB0B0B0
            align: CENTER
            y: 98
            width: 240
            text_align: CENTER
            long_mode: SCROLL_CIRCULAR
            hidden: true
        - label:
            id: label_loading_status
            text: "WiFi connecting..."
            text_font: rajdhani_medium_20
            text_color: 0x9A9A9A
            align: CENTER
            y: -90
            width: 255
            text_align: CENTER
            long_mode: SCROLL_CIRCULAR

    # ================= First-boot setup wizard =================
    # Welcome (auto-advances after 2s) -> language -> 10 HA-setup steps.
    # No swipe/arrow navigation - each step only advances by pressing the
    # knob. See refresh_wizard/wizard_next/wizard_finish.
    - id: screen_wizard
      bg_color: "0x000000"
      widgets:
        - button:
            id: button_wizard_background
            align: CENTER
            width: 360
            height: 360
            radius: 0
            bg_opa: TRANSP
            border_width: 0
            shadow_width: 0
            on_click:
              - script.execute: wake_display

        # Shared by the Welcome page and the Language page (only one text is
        # ever shown at a time - see refresh_wizard).
        - label:
            id: label_wizard_welcome
            text: "Welcome"
            text_font: rajdhani_semibold_60
            text_color: 0xFFFFFF
            align: CENTER
            x: 0
            y: 0
            width: 285
            text_align: CENTER
            long_mode: SCROLL_CIRCULAR
            hidden: true
        - label:
            id: label_wizard_lang_hint
            text: ""
            text_font: rajdhani_medium_20
            text_color: 0xCDBEEC
            align: CENTER
            y: 60
            width: 255
            text_align: CENTER
            long_mode: WRAP
            hidden: true

        - label:
            id: label_wizard_title
            text: ""
            text_font: rajdhani_medium_20
            text_color: 0xCDBEEC
            align: TOP_MID
            y: 60
            width: 285
            text_align: CENTER
            hidden: true
        # Fixed-height clipping/scrolling viewport for label_wizard_body -
        # some translations (esp. German step3/step4) are too long for the
        # label height, so refresh_wizard/check_finish_effects auto-scroll
        # the label inside this container top to bottom and back (see
        # wizard_scroll_pause_until_ms). Hidden flag toggling now targets
        # this container instead of the label directly.
        - obj:
            id: wizard_body_viewport
            align: CENTER
            width: 285
            height: 173
            bg_opa: TRANSP
            border_width: 0
            pad_all: 0
            scrollbar_mode: "OFF"
            hidden: true
            widgets:
              - label:
                  id: label_wizard_body
                  text: ""
                  text_font: rajdhani_medium_20
                  text_color: 0xEDEDED
                  align: TOP_MID
                  width: 285
                  height: SIZE_CONTENT
                  text_align: CENTER
                  long_mode: WRAP
        # Step 0 only - links to the full online guide (see refresh_wizard).
        - qrcode:
            id: wizard_qrcode
            text: "https://smart-knob.vexur-software.com/guide/setup"
            align: CENTER
            size: 225
            dark_color: 0x000000
            light_color: 0xFFFFFF
            hidden: true
        - label:
            id: label_wizard_finish_hint
            text: ""
            text_font: rajdhani_medium_20
            text_color: 0x9A9A9A
            align: BOTTOM_MID
            y: -60
            width: 285
            text_align: CENTER
            long_mode: WRAP
            hidden: true

        - label:
            id: label_wizard_page
            text: ""
            text_font: rajdhani_medium_20
            text_color: 0xCDBEEC
            align: TOP_MID
            y: 23
            hidden: true

    # ================= Home-Screen =================
    - id: screen_home
      bg_color: "0x000000"
      # The rotated CST816 reports physical vertical gestures as left/right.
      on_swipe_left:
        - script.execute: open_thermostat_quick
      on_swipe_right:
